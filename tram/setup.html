<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка остановок</title>
    <style>
        body {
            background: #0A0A14;
            color: #CCC;
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        h2 { color: #FFD700; }
        canvas { border: 2px solid #FFD700; cursor: crosshair; max-width: 100%; }
        .info { margin: 10px 0; font-size: 14px; }
        .output {
            background: #111; padding: 15px; margin-top: 15px;
            border-radius: 8px; text-align: left; font-size: 12px;
            max-height: 300px; overflow-y: auto; white-space: pre-wrap;
            color: #4CAF50;
        }
        button {
            padding: 12px 24px; margin: 8px;
            background: #4A8FCC; color: #000; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        button.reset { background: #CC6B6B; }
    </style>
</head>
<body>
    <h2>🖐 Расставь остановки на схеме</h2>
    <p class="info">Кликай по остановкам в порядке: <b id="stopOrder"></b></p>
    <p class="info" id="clickCount">Остановок расставлено: 0</p>
    <canvas id="canvas"></canvas>
    <br>
    <button onclick="undoLast()">↩ Отменить</button>
    <button class="reset" onclick="resetAll()">🔄 Сброс</button>
    <div class="output" id="output">JSON появится здесь после расстановки всех остановок...</div>

    <script>
        // Список остановок (в правильном порядке)
        var STOP_NAMES = [
            'Гагарина', 'Куранты', 'Дружбы', 'Юность', 'Грязнова', 'Пл. Мира'
        ];
        
        var points = [];
        var img = new Image();
        img.src = 'schema.png';  // ← ПОЛОЖИ СЮДА СВОЮ КАРТИНКУ
        
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        
        document.getElementById('stopOrder').textContent = STOP_NAMES.join(' → ');
        
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            drawAll();
        };
        
        img.onerror = function() {
            ctx.fillStyle = '#FF6B6B';
            ctx.font = '16px sans-serif';
            ctx.fillText('❌ schema.png не найден! Положи картинку в папку tram/', 20, 50);
        };
        
        canvas.addEventListener('click', function(e) {
            if (points.length >= STOP_NAMES.length) {
                alert('✅ Все остановки уже расставлены!');
                return;
            }
            
            var rect = canvas.getBoundingClientRect();
            var scaleX = img.width / rect.width;
            var scaleY = img.height / rect.height;
            
            var x = (e.clientX - rect.left) * scaleX;
            var y = (e.clientY - rect.top) * scaleY;
            
            points.push({ name: STOP_NAMES[points.length], x: Math.round(x), y: Math.round(y) });
            drawAll();
            updateOutput();
        });
        
        function drawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            
            // Рисуем точки
            points.forEach(function(p, i) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText((i+1), p.x, p.y + 4);
                
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(p.name, p.x, p.y - 14);
            });
            
            // Соединяем линиями
            if (points.length > 1) {
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (var i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
            }
            
            document.getElementById('clickCount').textContent = 
                'Остановок расставлено: ' + points.length + ' / ' + STOP_NAMES.length;
        }
        
        function updateOutput() {
            var output = document.getElementById('output');
            if (points.length === STOP_NAMES.length) {
                var json = JSON.stringify(points, null, 2);
                output.textContent = '✅ ГОТОВО! Скопируй этот JSON:\n\n' + json + 
                    '\n\nИ вставь в tram/map.html в переменную SCHEMA_STOPS';
                output.style.color = '#4CAF50';
            } else {
                output.textContent = 'Осталось расставить: ' + 
                    (STOP_NAMES.length - points.length) + ' остановок';
                output.style.color = '#888';
            }
        }
        
        function undoLast() {
            points.pop();
            drawAll();
            updateOutput();
        }
        
        function resetAll() {
            if (confirm('Сбросить все точки?')) {
                points = [];
                drawAll();
                updateOutput();
            }
        }
    </script>
</body>
</html>
