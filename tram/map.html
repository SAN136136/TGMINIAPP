<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска - Схема</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0A0A14;
            --gold: #FFD700;
            --blue: #58A6FF;
            --red: #FF6B6B;
            --green: #4CAF50;
            --text: #CCC;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 { color: var(--gold); font-size: 20px; margin-bottom: 2px; }
        .header .subtitle { color: #888; font-size: 12px; }
        
        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #2A2A4A;
            z-index: 1;
            background: #0D0D1A;
        }
        
        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            font-size: 11px;
            color: #888;
            margin: 8px 0;
        }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        
        .tram-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tram-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141428;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid var(--green);
            font-size: 13px;
            transition: all 0.2s;
        }
        .tram-row:hover { background: #1E1E3A; }
        .tram-row.stopped { border-left-color: var(--red); }
        .tram-row.highlight { background: #2A2A1E; border-left-color: #FFF; }
        .tram-route-num { color: var(--gold); font-weight: bold; font-size: 17px; min-width: 26px; }
        .tram-dist { color: var(--blue); font-weight: 600; margin-left: auto; }
        .tram-eta { color: var(--blue); font-size: 12px; margin-left: 6px; }
        
        .update-time {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin: 6px 0;
        }
        
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--bg); border-top: 1px solid #2A2A4A;
            display: flex; gap: 8px; z-index: 100;
        }
        
        .btn {
            padding: 12px 16px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            text-align: center; color: #000;
        }
        .btn-refresh { flex: 1; background: var(--blue); }
        .btn-close { flex: 1; background: var(--red); color: #fff; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .empty { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи на схеме</h1>
        <div class="subtitle">Гагарина ↔ Юность | Пл. Мира</div>
    </div>
    
    <div id="map"></div>
    
    <div class="legend">
        <span><span class="dot" style="background:#4CAF50;"></span> Едет</span>
        <span><span class="dot" style="background:#FF6B6B;"></span> Стоит</span>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div id="tramList">
        <div class="loading">Загружаем данные...</div>
    </div>
    
    <div class="bottom-bar">
        <button class="btn btn-refresh" onclick="loadData()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
    (function() {
        try {
            if (window.parent && window.parent !== window) {
                var parentLogin = window.parent.document.getElementById('loginScreen');
                if (parentLogin) parentLogin.style.display = 'none';
                var parentMain = window.parent.document.getElementById('mainScreen');
                if (parentMain) parentMain.style.display = 'block';
            }
        } catch(e) {}

        // ==================== КОНФИГУРАЦИЯ ====================
        // Координаты на картинке схемы (пиксели)
        // Эти значения нужно подогнать под твою картинку
        var STOP_GAGARINA = { x: 200, y: 150, name: 'Гагарина' };
        var STOP_MIRA = { x: 350, y: 150, name: 'Пл. Мира' };
        var STOP_YUNOST = { x: 600, y: 150, name: 'Юность' };
        var STOP_CIRK = { x: 350, y: 350, name: 'Цирк' };

        // API
        var API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        var PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 518062000668,
                rids: '1,3,5,7,9,11,12,14,21,22,23,25,10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 0
            }
        };
        var STOP_ROUTES = [1, 5, 11, 15, 17];
        
        var trams = [];
        var tramMarkersGroup;

        // ==================== ИНИЦИАЛИЗАЦИЯ КАРТЫ ====================
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 5,
            zoomControl: true,
            attributionControl: false
        });

        // Начальные границы для схемы
        var bounds = [[0, 0], [500, 800]];
        map.fitBounds(bounds);

        // Добавляем картинку схемы как слой
        var imageUrl = 'schema.png'; // <-- УБЕДИСЬ, ЧТО ФАЙЛ schema.png ЛЕЖИТ В ПАПКЕ tram/
        var imageBounds = [[0, 0], [500, 800]]; // Размеры картинки
        L.imageOverlay(imageUrl, imageBounds).addTo(map);

        // Группа для трамваев
        tramMarkersGroup = L.layerGroup().addTo(map);

        // Отрисовка остановок (уже есть на схеме, но для интерактивности)
        var stops = [STOP_GAGARINA, STOP_MIRA, STOP_YUNOST, STOP_CIRK];
        stops.forEach(function(stop) {
            var marker = L.circleMarker([stop.y, stop.x], {
                radius: 6,
                color: '#FFD700',
                fillColor: '#FFD700',
                fillOpacity: 0.8
            }).addTo(map);
            marker.bindPopup('<b>' + stop.name + '</b>');
        });

        // ==================== ФУНКЦИИ ====================
        function getTramIcon(speed, routeNum) {
            var isMoving = speed > 0;
            var color = isMoving ? '#4CAF50' : '#FF6B6B';
            return L.divIcon({
                className: 'tram-icon',
                html: '<div style="' +
                    'width:28px;height:28px;border-radius:50%;' +
                    'background:' + color + ';' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'color:#000;font-weight:bold;font-size:11px;' +
                    'border:2px solid #FFF;box-shadow:0 0 8px ' + color + ';' +
                    '">' + routeNum + '</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
        }

        // Функция для пересчета GPS в координаты схемы
        function gpsToSchema(lat, lng) {
            // Определяем, к какой линии ближе точка: Гагарина-Юность или Пл.Мира-Цирк
            var distToGagYun = distanceToLine(lat, lng, 53.398, 58.978, 53.416, 58.985);
            var distToMirCir = distanceToLine(lat, lng, 53.405, 58.985, 53.395, 59.000); // Примерные координаты Цирка
            
            if (distToMirCir < distToGagYun) {
                // Точка ближе к линии Пл.Мира - Цирк
                var percent = getPercentOnLine(lat, lng, 53.405, 58.985, 53.395, 59.000);
                return {
                    x: STOP_MIRA.x + (STOP_CIRK.x - STOP_MIRA.x) * percent,
                    y: STOP_MIRA.y + (STOP_CIRK.y - STOP_MIRA.y) * percent
                };
            } else {
                // Точка ближе к линии Гагарина - Юность
                var percent = getPercentOnLine(lat, lng, 53.398, 58.978, 53.416, 58.985);
                return {
                    x: STOP_GAGARINA.x + (STOP_YUNOST.x - STOP_GAGARINA.x) * percent,
                    y: STOP_GAGARINA.y + (STOP_YUNOST.y - STOP_GAGARINA.y) * percent
                };
            }
        }

        function getPercentOnLine(lat, lng, lat1, lng1, lat2, lng2) {
            // Упрощенный расчет: сравниваем долю широты
            var total = lat2 - lat1;
            if (Math.abs(total) < 0.001) total = lng2 - lng1;
            var current = lat - lat1;
            if (Math.abs(lat2 - lat1) < 0.001) current = lng - lng1;
            return Math.max(0, Math.min(1, current / total));
        }

        function distanceToLine(lat, lng, lat1, lng1, lat2, lng2) {
            // Упрощенное расстояние до отрезка
            var dlat = lat2 - lat1;
            var dlng = lng2 - lng1;
            var lengthSq = dlat*dlat + dlng*dlng;
            if (lengthSq < 0.000001) return Math.sqrt((lat-lat1)*(lat-lat1) + (lng-lng1)*(lng-lng1));
            var t = ((lat - lat1) * dlat + (lng - lng1) * dlng) / lengthSq;
            t = Math.max(0, Math.min(1, t));
            var projLat = lat1 + t * dlat;
            var projLng = lng1 + t * dlng;
            return Math.sqrt((lat-projLat)*(lat-projLat) + (lng-projLng)*(lng-projLng));
        }

        async function loadData() {
            try {
                var resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                var data = await resp.json();
                
                if (data.r === 'ok') {
                    var allVehicles = data.data.anims.filter(function(v) {
                        if (v.rtype !== 'Тм') return false;
                        return STOP_ROUTES.includes(parseInt(v.rnum));
                    });
                    
                    trams = allVehicles;
                    updateTramMarkers();
                    renderList();
                    
                    var now = new Date();
                    document.getElementById('updateTime').textContent = 
                        '🕐 ' + now.toLocaleTimeString('ru-RU') + 
                        ' | 🚋 ' + trams.length + ' трамваев';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateTramMarkers() {
            tramMarkersGroup.clearLayers();
            
            trams.forEach(function(tram) {
                var pos = gpsToSchema(tram.lat, tram.lng);
                var icon = getTramIcon(tram.speed, tram.rnum);
                var marker = L.marker([pos.y, pos.x], { icon: icon }).addTo(tramMarkersGroup);
                
                var speedText = tram.speed > 0 ? tram.speed + ' км/ч' : 'Стоит';
                marker.bindPopup('<b>🚋 №' + tram.rnum + '</b><br>' +
                    '⚡ ' + speedText + '<br>' +
                    '🕐 ' + (tram.navTime || '').substr(-8));
            });
        }

        function renderList() {
            var container = document.getElementById('tramList');
            if (!container) return;
            
            if (trams.length === 0) {
                container.innerHTML = '<div class="empty">Нет трамваев на линии</div>';
                return;
            }
            
            var sorted = [...trams].sort(function(a, b) {
                var distA = haversine(53.398, 58.978, a.lat, a.lng);
                var distB = haversine(53.398, 58.978, b.lat, b.lng);
                return distA - distB;
            });
            
            var html = '<div class="tram-list">';
            sorted.forEach(function(t) {
                var isMoving = t.speed > 0;
                var distToGagarina = Math.round(haversine(53.398, 58.978, t.lat, t.lng));
                var eta = '';
                if (isMoving && t.speed > 0) {
                    eta = '⏱ ~' + Math.round(distToGagarina / (t.speed * 1000 / 60)) + ' мин';
                }
                
                html += '<div class="tram-row ' + (isMoving ? '' : 'stopped') + '" ' +
                    'onclick="focusOnTram(' + t.lat + ', ' + t.lng + ')">';
                html += '<span class="tram-route-num">№' + t.rnum + '</span>';
                html += '<span>' + (isMoving ? t.speed + ' км/ч' : 'Стоит') + '</span>';
                html += '<span class="tram-dist">' + distToGagarina + 'м</span>';
                if (eta) html += '<span class="tram-eta">' + eta + '</span>';
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }

        window.focusOnTram = function(lat, lng) {
            var pos = gpsToSchema(lat, lng);
            map.flyTo([pos.y, pos.x], 2, { duration: 0.5 });
        };

        function haversine(lat1, lng1, lat2, lng2) {
            var R = 6371000;
            var dlat = (lat2 - lat1) * Math.PI / 180;
            var dlng = (lng2 - lng1) * Math.PI / 180;
            var a = Math.sin(dlat/2) * Math.sin(dlat/2) + 
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dlng/2) * Math.sin(dlng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function closeWindow() {
            try {
                if (window.parent && window.parent !== window) {
                    var modal = window.parent.document.getElementById('tramModal');
                    if (modal) window.parent.document.body.removeChild(modal);
                    var closeBtn = window.parent.document.querySelector('button[style*="z-index: 10000"]');
                    if (closeBtn) window.parent.document.body.removeChild(closeBtn);
                }
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setInterval(loadData, 15000);
        });
    })();
    </script>
</body>
</html>
