<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    <style>
        :root {
            --bg: #0A0A14;
            --gold: #C9A84C;
            --blue: #4A8FCC;
            --red: #CC6B6B;
            --green: #5A9E6F;
            --text: #BBB;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }
        
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { color: var(--gold); font-size: 20px; margin-bottom: 2px; }
        .header .subtitle { color: #888; font-size: 12px; }
        
        .map-wrap {
            position: relative;
            width: 100%;
            background: #0D0D1A;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2A2A4A;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .legend {
            display: flex; gap: 16px; justify-content: center;
            font-size: 11px; color: #888; margin: 8px 0;
        }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        
        .tram-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; }
        
        .tram-row {
            display: flex; align-items: center; gap: 8px;
            background: #141428; padding: 10px 12px;
            border-radius: 8px; cursor: pointer;
            border-left: 3px solid var(--green);
            font-size: 13px; transition: all 0.2s;
        }
        .tram-row:hover { background: #1E1E3A; }
        .tram-row.stopped { border-left-color: var(--red); }
        .tram-route-num { color: var(--gold); font-weight: bold; font-size: 17px; min-width: 26px; }
        .tram-dist { color: var(--blue); font-weight: 600; margin-left: auto; }
        .tram-eta { color: var(--blue); font-size: 12px; margin-left: 6px; }
        
        .update-time { text-align: center; font-size: 11px; color: #555; margin: 6px 0; }
        
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--bg); border-top: 1px solid #2A2A4A;
            display: flex; gap: 8px; z-index: 100;
        }
        
        .btn {
            padding: 12px 16px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            text-align: center; color: #000; flex: 1;
        }
        .btn-refresh { background: var(--blue); }
        .btn-close { background: var(--red); color: #fff; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .empty { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle">Гагарина → Куранты → Дружбы → Юность → пл. Мира</div>
    </div>
    
    <div class="map-wrap">
        <canvas id="tramCanvas" width="400" height="750"></canvas>
    </div>
    
    <div class="legend">
        <span><span class="dot" style="background:#5A9E6F;"></span> Едет</span>
        <span><span class="dot" style="background:#CC6B6B;"></span> Стоит</span>
        <span><span class="dot" style="background:#C9A84C;"></span> Остановка</span>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div id="tramList">
        <div class="loading">Загружаем данные...</div>
    </div>
    
    <div class="bottom-bar">
        <button class="btn btn-refresh" onclick="loadData()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>

    <script>
    (function() {
        try {
            if (window.parent && window.parent !== window) {
                var parentLogin = window.parent.document.getElementById('loginScreen');
                if (parentLogin) parentLogin.style.display = 'none';
                var parentMain = window.parent.document.getElementById('mainScreen');
                if (parentMain) parentMain.style.display = 'block';
            }
        } catch(e) {}
        
        // ==================== КООРДИНАТЫ ОСТАНОВОК НА СХЕМЕ ====================
        var SCHEMA_STOPS = [
            { name: "Гагарина", x: 190, y: 540 },
            { name: "Куранты", x: 190, y: 570 },
            { name: "Дружбы", x: 190, y: 600 },
            { name: "Юность", x: 190, y: 650 },
            { name: "Грязнова", x: 180, y: 660 },
            { name: "Пл. Мира", x: 210, y: 660 }
        ];
        
        var STOP_ROUTES = [1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31];
        
        var API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        var PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 518062000668,
                rids: '1,3,5,7,9,11,12,14,21,22,23,25,10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 0
            }
        };
        
        var GPS_STOPS = [
            { lat: 53.3936, lng: 58.9898 },
            { lat: 53.3921, lng: 58.9937 },
            { lat: 53.3902, lng: 58.9979 },
            { lat: 53.3880, lng: 59.0022 },
            { lat: 53.3866, lng: 59.0041 },
            { lat: 53.3858, lng: 59.0060 }
        ];
        
        var trams = [];
        var canvas = document.getElementById('tramCanvas');
        var ctx = canvas.getContext('2d');
        var W = canvas.width;
        var H = canvas.height;
        
        // ==================== ОТРИСОВКА СХЕМЫ ====================
        function drawBackground() {
            ctx.fillStyle = '#0D0D1A';
            ctx.fillRect(0, 0, W, H);
            
            // Линии между остановками
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (var i = 0; i < SCHEMA_STOPS.length - 2; i++) {
                ctx.moveTo(SCHEMA_STOPS[i].x, SCHEMA_STOPS[i].y);
                ctx.lineTo(SCHEMA_STOPS[i+1].x, SCHEMA_STOPS[i+1].y);
            }
            ctx.stroke();
            
            // Ответвление Юность → Грязнова → Пл. Мира
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(SCHEMA_STOPS[3].x, SCHEMA_STOPS[3].y);
            ctx.lineTo(SCHEMA_STOPS[4].x, SCHEMA_STOPS[4].y);
            ctx.lineTo(SCHEMA_STOPS[5].x, SCHEMA_STOPS[5].y);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Остановки
            SCHEMA_STOPS.forEach(function(stop) {
                ctx.fillStyle = '#C9A84C';
                ctx.beginPath();
                ctx.arc(stop.x, stop.y, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#C9A84C';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(stop.name, stop.x, stop.y - 12);
            });
            
            // Надписи по краям
            ctx.fillStyle = '#555';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('⬆ к центру / Гагарина', 10, 20);
            ctx.fillText('⬇ к мосту / Юность', 10, H - 10);
        }
        
        function drawTramsOnMap() {
            drawBackground();
            
            if (trams.length === 0) return;
            
            trams.forEach(function(tram) {
                var pos = findNearestStop(tram.lat, tram.lng);
                if (!pos) return;
                
                var isMoving = tram.speed > 0;
                var color = isMoving ? '#5A9E6F' : '#CC6B6B';
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y + 3, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y + 3, 8, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(tram.rnum, pos.x, pos.y + 6);
            });
        }
        
        function findNearestStop(lat, lng) {
            var minDist = Infinity;
            var nearestIdx = 0;
            
            GPS_STOPS.forEach(function(stop, i) {
                var d = Math.abs(lat - stop.lat) + Math.abs(lng - stop.lng) * 100;
                if (d < minDist) {
                    minDist = d;
                    nearestIdx = i;
                }
            });
            
            return SCHEMA_STOPS[nearestIdx];
        }
        
        // ==================== ДАННЫЕ ====================
        async function loadData() {
            try {
                var resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                var data = await resp.json();
                
                if (data.r === 'ok') {
                    trams = data.data.anims.filter(function(v) {
                        if (v.rtype !== 'Тм') return false;
                        return STOP_ROUTES.includes(parseInt(v.rnum));
                    });
                    
                    drawTramsOnMap();
                    renderList();
                    
                    document.getElementById('updateTime').textContent = 
                        '🕐 ' + new Date().toLocaleTimeString('ru-RU') + 
                        ' | 🚋 ' + trams.length + ' ед.';
                }
            } catch (e) { console.error(e); }
        }
        
        function renderList() {
            var container = document.getElementById('tramList');
            if (!container) return;
            
            if (trams.length === 0) {
                container.innerHTML = '<div class="empty">Нет трамваев на линии</div>';
                return;
            }
            
            var sorted = [...trams].sort(function(a, b) {
                return Math.abs(a.lat - 53.3936) - Math.abs(b.lat - 53.3936);
            });
            
            var html = '<div class="tram-list">';
            sorted.forEach(function(t) {
                var isMoving = t.speed > 0;
                var dist = Math.round(haversine(53.3936, 58.9898, t.lat, t.lng));
                var eta = '';
                if (isMoving && t.speed > 0) eta = '⏱ ~' + Math.round(dist / (t.speed * 1000 / 60)) + ' мин';
                
                html += '<div class="tram-row ' + (isMoving ? '' : 'stopped') + '">' +
                    '<span class="tram-route-num">№' + t.rnum + '</span>' +
                    '<span>' + (isMoving ? t.speed + ' км/ч' : 'Стоит') + '</span>' +
                    '<span class="tram-dist">' + dist + 'м</span>' +
                    (eta ? '<span class="tram-eta">' + eta + '</span>' : '') +
                    '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function haversine(lat1, lng1, lat2, lng2) {
            var R = 6371000;
            var dlat = (lat2 - lat1) * Math.PI / 180;
            var dlng = (lng2 - lng1) * Math.PI / 180;
            var a = Math.sin(dlat/2) * Math.sin(dlat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dlng/2) * Math.sin(dlng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function closeWindow() {
            try {
                if (window.parent && window.parent !== window) {
                    var modal = window.parent.document.getElementById('tramModal');
                    if (modal) window.parent.document.body.removeChild(modal);
                }
            } catch(e) {}
        }
        
        // Запуск
        drawBackground();
        loadData();
        setInterval(loadData, 15000);
    })();
    </script>
</body>
</html>
