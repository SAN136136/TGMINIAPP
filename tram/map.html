<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0A0A14;
            --gold: #C9A84C;
            --blue: #4A8FCC;
            --red: #CC6B6B;
            --green: #5A9E6F;
            --text: #BBB;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }
        
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { color: var(--gold); font-size: 20px; margin-bottom: 2px; }
        .header .subtitle { color: #888; font-size: 12px; }
        
        #map {
            width: 100%;
            height: 450px;
            border-radius: 12px;
            border: 1px solid #2A2A4A;
            z-index: 1;
        }
        
        .legend {
            display: flex; gap: 16px; justify-content: center;
            font-size: 11px; color: #888; margin: 8px 0; flex-wrap: wrap;
        }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        
        .tram-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; }
        
        .tram-row {
            display: flex; align-items: center; gap: 8px;
            background: #141428; padding: 10px 12px;
            border-radius: 8px; cursor: pointer;
            border-left: 3px solid var(--green);
            font-size: 13px; transition: all 0.2s;
        }
        .tram-row:hover { background: #1E1E3A; }
        .tram-row.stopped { border-left-color: var(--red); }
        .tram-row.highlight { background: #2A2A1E; border-left-color: #FFF; }
        .tram-route-num { color: var(--gold); font-weight: bold; font-size: 17px; min-width: 26px; }
        .tram-dist { color: var(--blue); font-weight: 600; margin-left: auto; }
        .tram-eta { color: var(--blue); font-size: 12px; margin-left: 6px; }
        
        .update-time { text-align: center; font-size: 11px; color: #555; margin: 6px 0; }
        
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--bg); border-top: 1px solid #2A2A4A;
            display: flex; gap: 8px; z-index: 100;
        }
        
        .btn {
            padding: 12px 16px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            text-align: center; color: #000;
        }
        .btn-refresh { flex: 1; background: var(--blue); }
        .btn-close { flex: 1; background: var(--red); color: #fff; }
        .btn-edit { 
            flex: 1; background: #C9A84C; color: #000; 
        }
        .btn-edit.active { background: #4CAF50; color: #fff; }
        .btn-save { flex: 1; background: #4CAF50; color: #fff; display: none; }
        .btn-save.show { display: block; }
        .btn-reset { flex: 1; background: #666; color: #fff; font-size: 11px; }
        
        .edit-hint {
            display: none;
            text-align: center;
            font-size: 12px;
            color: #4CAF50;
            margin: 4px 0;
            padding: 6px;
            background: rgba(76,175,80,0.1);
            border-radius: 6px;
        }
        .edit-hint.show { display: block; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .empty { text-align: center; padding: 20px; color: #666; }
        
        .leaflet-popup-content-wrapper { background: #1A1A2E !important; color: #CCC !important; border-radius: 8px !important; }
        .leaflet-popup-tip { background: #1A1A2E !important; }
        .leaflet-popup-content { font-size: 13px; margin: 8px 12px; }
        .leaflet-popup-content b { color: var(--gold); }
        
        /* Стиль для редактируемых маркеров */
        .edit-marker {
            cursor: move !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle">Юность ↔ Гагарина | Пл. Мира</div>
    </div>
    
    <div id="map"></div>
    
    <div class="edit-hint" id="editHint">
        ✋ Режим редактирования: перетаскивай остановки мышкой
    </div>
    
    <div class="legend">
        <span><span class="dot" style="background:#5A9E6F;"></span> Едет</span>
        <span><span class="dot" style="background:#CC6B6B;"></span> Стоит</span>
        <span><span class="dot" style="background:#C9A84C;"></span> Остановка</span>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div id="tramList">
        <div class="loading">Загружаем данные...</div>
    </div>
    
    <div class="bottom-bar">
        <button class="btn btn-edit" id="btnEdit" onclick="toggleEditMode()">✏️ Править</button>
        <button class="btn btn-save" id="btnSave" onclick="saveStops()">💾 Сохранить</button>
        <button class="btn btn-refresh" onclick="loadData()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
    (function() {
        try {
            if (window.parent && window.parent !== window) {
                var parentLogin = window.parent.document.getElementById('loginScreen');
                if (parentLogin) parentLogin.style.display = 'none';
                var parentMain = window.parent.document.getElementById('mainScreen');
                if (parentMain) parentMain.style.display = 'block';
            }
        } catch(e) {}
        
        // ==================== ЗАГРУЗКА СОХРАНЁННЫХ ОСТАНОВОК ====================
        function loadSavedStops() {
            var saved = localStorage.getItem('tram_stops_v2');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) {}
            }
            // Стандартные координаты (будут перезаписаны при редактировании)
            return [
                { lat: 53.4160, lng: 58.9900, name: 'Юность', routes: '7, 9, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4155, lng: 58.9880, name: 'Дружбы', routes: '7, 9, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4140, lng: 58.9860, name: 'Гостиный двор', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4120, lng: 58.9840, name: 'Завенягина', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4090, lng: 58.9820, name: 'Политех', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4065, lng: 58.9800, name: 'Советской Армии', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4050, lng: 58.9780, name: 'Пл. Мира', routes: '1, 3, 11, 14, 16, 20, 22, 33' },
                { lat: 53.4035, lng: 58.9760, name: 'Карла Маркса', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4005, lng: 58.9740, name: 'Центральный рынок', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.3980, lng: 58.9720, name: 'Гагарина', routes: '1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31' },
                { lat: 53.4030, lng: 58.9800, name: 'Цирк', routes: '11, 14, 16, 22' }
            ];
        }
        
        function saveStopsToStorage(stops) {
            // Сохраняем только lat, lng, name, routes
            var toSave = stops.map(function(s) {
                return { lat: s.lat, lng: s.lng, name: s.name, routes: s.routes };
            });
            localStorage.setItem('tram_stops_v2', JSON.stringify(toSave));
            console.log('💾 Остановки сохранены:', toSave);
        }
        
        var STOPS = loadSavedStops();
        
        // ==================== КОНФИГУРАЦИЯ ====================
        var STOP_ROUTES = [1, 5, 11, 15, 17, 20, 22, 24, 27, 29, 31];
        
        var API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        var PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 518062000668,
                rids: '1,3,5,7,9,11,12,14,21,22,23,25,10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 0
            }
        };
        
        var trams = [];
        var tramLayer;
        var tramMarkers = {};
        var stopMarkers = [];
        var isEditMode = false;
        
        // ==================== КАРТА ====================
        var map = L.map('map').setView([53.407, 58.981], 15);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Линия пути
        function updatePathLine() {
            // Удаляем старую линию, если есть
            if (window._pathLine) map.removeLayer(window._pathLine);
            
            var coords = STOPS.map(function(s) { return [s.lat, s.lng]; });
            window._pathLine = L.polyline(coords, {
                color: '#8B7D3C', weight: 4, opacity: 0.7
            }).addTo(map);
        }
        
        // Создаём/обновляем маркеры остановок
        function renderStopMarkers() {
            // Удаляем старые
            stopMarkers.forEach(function(m) { map.removeLayer(m); });
            stopMarkers = [];
            
            STOPS.forEach(function(stop, index) {
                var marker = L.marker([stop.lat, stop.lng], {
                    draggable: isEditMode,
                    icon: L.divIcon({
                        className: isEditMode ? 'edit-marker' : '',
                        html: '<div style="' +
                            'width:14px;height:14px;border-radius:50%;' +
                            'background:' + (isEditMode ? '#FFD700' : '#5A4E2C') + ';' +
                            'border:2px solid ' + (isEditMode ? '#FFF' : '#8B7D3C') + ';' +
                            'box-shadow:0 0 4px rgba(0,0,0,0.5);' +
                            '"></div>',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }).addTo(map);
                
                // Подпись
                var label = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="color:' + (isEditMode ? '#FFD700' : '#8B7D3C') + ';font-size:9px;font-weight:bold;text-shadow:0 0 3px #000;white-space:nowrap;transform:translate(-50%,-180%);">' + 
                            (isEditMode ? '🖐 ' : '') + stop.name + '</div>',
                        iconSize: [0, 0]
                    })
                }).addTo(map);
                
                marker.bindPopup('<b>' + stop.name + '</b><br>🚋 ' + stop.routes);
                
                // Обработчик перетаскивания
                marker.on('dragend', function(e) {
                    var pos = e.target.getLatLng();
                    STOPS[index].lat = pos.lat;
                    STOPS[index].lng = pos.lng;
                    console.log('📍 ' + STOPS[index].name + ' → ' + pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5));
                    updatePathLine();
                    renderStopMarkers();
                });
                
                stopMarkers.push(marker);
                stopMarkers.push(label);
            });
            
            updatePathLine();
        }
        
        tramLayer = L.layerGroup().addTo(map);
        
        // ==================== РЕЖИМ РЕДАКТИРОВАНИЯ ====================
        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            var btnEdit = document.getElementById('btnEdit');
            var btnSave = document.getElementById('btnSave');
            var editHint = document.getElementById('editHint');
            
            if (isEditMode) {
                btnEdit.textContent = '👁 Смотр';
                btnEdit.classList.add('active');
                btnSave.classList.add('show');
                editHint.classList.add('show');
            } else {
                btnEdit.textContent = '✏️ Править';
                btnEdit.classList.remove('active');
                btnSave.classList.remove('show');
                editHint.classList.remove('show');
            }
            
            renderStopMarkers();
        };
        
        window.saveStops = function() {
            saveStopsToStorage(STOPS);
            alert('✅ Остановки сохранены!\n\nКоординаты записаны в память браузера.\nТеперь они будут использоваться всегда.');
            console.log('📋 Сохранённые остановки:');
            STOPS.forEach(function(s, i) {
                console.log((i+1) + '. ' + s.name + ': ' + s.lat + ', ' + s.lng);
            });
        };
        
        // Кнопка сброса
        window.resetStops = function() {
            if (confirm('Сбросить все остановки к стандартным координатам?')) {
                localStorage.removeItem('tram_stops_v2');
                STOPS = loadSavedStops();
                renderStopMarkers();
                alert('🔄 Остановки сброшены к стандартным.');
            }
        };
        
        // ==================== ФУНКЦИИ ТРАМВАЕВ ====================
        function getTramIcon(speed, routeNum) {
            var color = speed > 0 ? '#5A9E6F' : '#CC6B6B';
            return L.divIcon({
                className: '',
                html: '<div style="' +
                    'width:24px;height:24px;border-radius:50%;' +
                    'background:' + color + ';' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'color:#000;font-weight:bold;font-size:10px;' +
                    'border:2px solid rgba(255,255,255,0.6);box-shadow:0 0 4px ' + color + ';' +
                    '">' + routeNum + '</div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }
        
        async function loadData() {
            try {
                var resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                var data = await resp.json();
                
                if (data.r === 'ok') {
                    trams = data.data.anims.filter(function(v) {
                        if (v.rtype !== 'Тм') return false;
                        return STOP_ROUTES.includes(parseInt(v.rnum));
                    });
                    
                    updateTramMarkers();
                    renderList();
                    
                    document.getElementById('updateTime').textContent = 
                        '🕐 ' + new Date().toLocaleTimeString('ru-RU') + 
                        ' | 🚋 ' + trams.length + ' ед.';
                }
            } catch (e) { console.error(e); }
        }
        
        function updateTramMarkers() {
            tramLayer.clearLayers();
            tramMarkers = {};
            
            trams.forEach(function(tram) {
                var id = tram.deviceCode || tram.gosNum;
                var icon = getTramIcon(tram.speed, tram.rnum);
                var marker = L.marker([tram.lat, tram.lng], { icon: icon }).addTo(tramLayer);
                
                var speedText = tram.speed > 0 ? tram.speed + ' км/ч' : 'Стоит';
                marker.bindPopup(
                    '<b>🚋 №' + tram.rnum + '</b><br>' +
                    '🏷️ ' + tram.gosNum + '<br>' +
                    '⚡ ' + speedText + '<br>' +
                    '🕐 ' + (tram.navTime || '').substr(-8)
                );
                
                tramMarkers[id] = marker;
            });
        }
        
        function renderList() {
            var container = document.getElementById('tramList');
            if (!container) return;
            
            if (trams.length === 0) {
                container.innerHTML = '<div class="empty">Нет трамваев на линии</div>';
                return;
            }
            
            // Сортируем по расстоянию до Гагарина
            var gagLat = STOPS[STOPS.length - 2].lat; // Гагарина — предпоследняя
            var gagLng = STOPS[STOPS.length - 2].lng;
            
            var sorted = [...trams].sort(function(a, b) {
                return haversine(gagLat, gagLng, a.lat, a.lng) - haversine(gagLat, gagLng, b.lat, b.lng);
            });
            
            var html = '<div class="tram-list">';
            sorted.forEach(function(t) {
                var isMoving = t.speed > 0;
                var dist = Math.round(haversine(gagLat, gagLng, t.lat, t.lng));
                var eta = '';
                if (isMoving && t.speed > 0) eta = '⏱ ~' + Math.round(dist / (t.speed * 1000 / 60)) + ' мин';
                
                html += '<div class="tram-row ' + (isMoving ? '' : 'stopped') + '" ' +
                    'onclick="focusOnTram(\'' + (t.deviceCode || t.gosNum) + '\', ' + t.lat + ', ' + t.lng + ')">' +
                    '<span class="tram-route-num">№' + t.rnum + '</span>' +
                    '<span>' + (isMoving ? t.speed + ' км/ч' : 'Стоит') + '</span>' +
                    '<span class="tram-dist">' + dist + 'м</span>' +
                    (eta ? '<span class="tram-eta">' + eta + '</span>' : '') +
                    '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        window.focusOnTram = function(id, lat, lng) {
            map.flyTo([lat, lng], 16, { duration: 0.8 });
            document.querySelectorAll('.tram-row').forEach(function(r) { r.classList.remove('highlight'); });
            if (tramMarkers[id]) tramMarkers[id].openPopup();
        };
        
        function haversine(lat1, lng1, lat2, lng2) {
            var R = 6371000;
            var dlat = (lat2 - lat1) * Math.PI / 180;
            var dlng = (lng2 - lng1) * Math.PI / 180;
            var a = Math.sin(dlat/2) * Math.sin(dlat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dlng/2) * Math.sin(dlng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function closeWindow() {
            try {
                if (window.parent && window.parent !== window) {
                    var modal = window.parent.document.getElementById('tramModal');
                    if (modal) window.parent.document.body.removeChild(modal);
                }
            } catch(e) {}
        }
        
        // ==================== ЗАПУСК ====================
        document.addEventListener('DOMContentLoaded', function() {
            renderStopMarkers();
            loadData();
            setInterval(loadData, 15000);
            
            // Добавляем кнопку сброса (маленькая, в уголке)
            var resetBtn = document.createElement('button');
            resetBtn.textContent = '↺ Сброс';
            resetBtn.style.cssText = 'position:fixed;top:50px;right:8px;z-index:1000;padding:4px 8px;font-size:10px;background:#333;color:#888;border:1px solid #555;border-radius:4px;cursor:pointer;';
            resetBtn.onclick = window.resetStops;
            document.body.appendChild(resetBtn);
        });
        
        map.on('click', function() {
            document.querySelectorAll('.tram-row').forEach(function(r) { r.classList.remove('highlight'); });
        });
    })();
    </script>
</body>
</html>
