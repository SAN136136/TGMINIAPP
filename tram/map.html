<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg: #0A0A14;
            --gold: #FFD700;
            --blue: #58A6FF;
            --red: #FF6B6B;
            --green: #4CAF50;
            --text: #CCC;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 { color: var(--gold); font-size: 20px; margin-bottom: 2px; }
        .header .subtitle { color: #888; font-size: 12px; }
        
        #map {
            width: 100%;
            height: 450px;
            border-radius: 12px;
            border: 1px solid #2A2A4A;
            z-index: 1;
        }
        
        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            font-size: 11px;
            color: #888;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        
        .tram-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tram-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141428;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid var(--green);
            font-size: 13px;
            transition: all 0.2s;
        }
        .tram-row:hover { background: #1E1E3A; }
        .tram-row.stopped { border-left-color: var(--red); }
        .tram-row.highlight { background: #2A2A1E; border-left-color: #FFF; }
        .tram-route-num { color: var(--gold); font-weight: bold; font-size: 17px; min-width: 26px; }
        .tram-dist { color: var(--blue); font-weight: 600; margin-left: auto; }
        .tram-eta { color: var(--blue); font-size: 12px; margin-left: 6px; }
        
        .update-time {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin: 6px 0;
        }
        
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--bg); border-top: 1px solid #2A2A4A;
            display: flex; gap: 8px; z-index: 100;
        }
        
        .btn {
            padding: 12px 16px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            text-align: center; color: #000;
        }
        .btn-refresh { flex: 1; background: var(--blue); }
        .btn-close { flex: 1; background: var(--red); color: #fff; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .empty { text-align: center; padding: 20px; color: #666; }
        
        /* Стили для popup */
        .leaflet-popup-content-wrapper {
            background: #1A1A2E !important;
            color: #CCC !important;
            border-radius: 8px !important;
        }
        .leaflet-popup-tip { background: #1A1A2E !important; }
        .leaflet-popup-content { font-size: 13px; margin: 8px 12px; }
        .leaflet-popup-content b { color: #FFD700; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle">Гагарина ↔ Юность | Пл. Мира</div>
    </div>
    
    <div id="map"></div>
    
    <div class="legend">
        <span><span class="dot" style="background:#4CAF50;"></span> Едет</span>
        <span><span class="dot" style="background:#FF6B6B;"></span> Стоит</span>
        <span><span class="dot" style="background:#FFD700;"></span> Остановка</span>
        <span style="font-size:10px;">📏 Линия пути</span>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div id="tramList">
        <div class="loading">Загружаем данные...</div>
    </div>
    
    <div class="bottom-bar">
        <button class="btn btn-refresh" onclick="loadData()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
    (function() {
        // Скрываем loginScreen родителя, если мы в iframe
        try {
            if (window.parent && window.parent !== window) {
                var parentLogin = window.parent.document.getElementById('loginScreen');
                if (parentLogin) parentLogin.style.display = 'none';
                var parentMain = window.parent.document.getElementById('mainScreen');
                if (parentMain) parentMain.style.display = 'block';
            }
        } catch(e) {}
        
        // ==================== КОНФИГУРАЦИЯ ====================
        var CENTER_LAT = 53.407;
        var CENTER_LNG = 58.982;
        var DEFAULT_ZOOM = 14;
        
        // Остановки с маршрутами
        var STOPS = [
            { lat: 53.398, lng: 58.978, name: 'Гагарина', routes: '1, 5, 11, 15, 17' },
            { lat: 53.405, lng: 58.985, name: 'Пл. Мира', routes: '1, 3, 11, 14, 16, 33' },
            { lat: 53.416, lng: 58.985, name: 'Юность', routes: '7, 9, 15, 17, 20' },
            { lat: 53.407, lng: 58.983, name: 'Цирк', routes: '11, 14' },
            { lat: 53.412, lng: 58.982, name: 'Грязнова', routes: '11, 14, 16А' }
        ];
        
        // Линия пути (проспект Карла Маркса)
        var TRAM_LINE = [
            [53.393, 58.977],
            [53.398, 58.978],  // Гагарина
            [53.401, 58.980],
            [53.405, 58.985],  // Пл. Мира
            [53.408, 58.983],
            [53.412, 58.982],  // Грязнова
            [53.416, 58.985],  // Юность
            [53.420, 58.986]
        ];
        
        var STOP_ROUTES = [1, 5, 11, 15, 17];
        
        // API
        var API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        var PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 518062000668,
                rids: '1,3,5,7,9,11,12,14,21,22,23,25,10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 0
            }
        };
        
        // ==================== ИНИЦИАЛИЗАЦИЯ КАРТЫ ====================
        var map = L.map('map').setView([CENTER_LAT, CENTER_LNG], DEFAULT_ZOOM);
        
        // Тёмная подложка
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Линия трамвайного пути
        var tramLine = L.polyline(TRAM_LINE, {
            color: '#FFD700',
            weight: 5,
            opacity: 0.7,
            dashArray: '10, 10'
        }).addTo(map);
        
        // Маркеры остановок
        var stopMarkers = [];
        STOPS.forEach(function(stop) {
            var marker = L.circleMarker([stop.lat, stop.lng], {
                radius: 9,
                color: '#FFD700',
                fillColor: '#FFD700',
                fillOpacity: 0.9,
                weight: 2
            }).addTo(map);
            
            marker.bindPopup(
                '<b>' + stop.name + '</b><br>' +
                '🚋 Маршруты: ' + stop.routes
            );
            
            // Подпись остановки
            L.marker([stop.lat, stop.lng], {
                icon: L.divIcon({
                    className: 'stop-label',
                    html: '<div style="color:#FFD700;font-size:10px;font-weight:bold;text-shadow:0 0 4px #000;white-space:nowrap;margin-left:-20px;margin-top:-22px;">' + stop.name + '</div>',
                    iconSize: [0, 0]
                })
            }).addTo(map);
            
            stopMarkers.push(marker);
        });
        
        // Группа для маркеров трамваев
        var tramLayer = L.layerGroup().addTo(map);
        var trams = [];
        var tramMarkers = {};
        
        // ==================== ФУНКЦИИ ====================
        function getTramIcon(speed, routeNum) {
            var isMoving = speed > 0;
            var color = isMoving ? '#4CAF50' : '#FF6B6B';
            var arrow = isMoving ? '▲' : '■';
            
            return L.divIcon({
                className: 'tram-icon',
                html: '<div style="' +
                    'width:28px;height:28px;border-radius:50%;' +
                    'background:' + color + ';' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'color:#000;font-weight:bold;font-size:11px;' +
                    'border:2px solid #FFF;box-shadow:0 0 8px ' + color + ';' +
                    '">' + routeNum + '</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
        }
        
        async function loadData() {
            try {
                var resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                var data = await resp.json();
                
                if (data.r === 'ok') {
                    // Фильтруем трамваи
                    var allVehicles = data.data.anims.filter(function(v) {
                        if (v.rtype !== 'Тм') return false;
                        return STOP_ROUTES.includes(parseInt(v.rnum));
                    });
                    
                    trams = allVehicles;
                    updateTramMarkers();
                    renderList();
                    
                    var now = new Date();
                    document.getElementById('updateTime').textContent = 
                        '🕐 Обновлено: ' + now.toLocaleTimeString('ru-RU') + 
                        ' | 🚋 Трамваев: ' + trams.length;
                }
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }
        
        function updateTramMarkers() {
            // Очищаем старые маркеры
            tramLayer.clearLayers();
            tramMarkers = {};
            
            trams.forEach(function(tram) {
                var id = tram.deviceCode || tram.gosNum;
                var icon = getTramIcon(tram.speed, tram.rnum);
                
                var marker = L.marker([tram.lat, tram.lng], { icon: icon }).addTo(tramLayer);
                
                // Popup с информацией
                var speedText = tram.speed > 0 ? tram.speed + ' км/ч' : 'Стоит';
                var dirArrow = getDirectionArrow(tram.dir);
                marker.bindPopup(
                    '<b>🚋 Трамвай №' + tram.rnum + '</b><br>' +
                    '🏷️ Борт: ' + tram.gosNum + '<br>' +
                    '⚡ ' + speedText + ' ' + dirArrow + '<br>' +
                    '🕐 ' + (tram.navTime || '').substr(-8) + '<br>' +
                    '<a href="https://maps.yandex.ru/?ll=' + tram.lng + ',' + tram.lat + '&z=16" target="_blank">📍 На карте</a>'
                );
                
                tramMarkers[id] = marker;
            });
        }
        
        function getDirectionArrow(dir) {
            if (dir === undefined || dir === null) return '';
            var arrows = ['⬆️', '↗️', '➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️'];
            var idx = Math.round(dir / 45) % 8;
            return arrows[idx] || '';
        }
        
        function renderList() {
            var container = document.getElementById('tramList');
            if (!container) return;
            
            if (trams.length === 0) {
                container.innerHTML = '<div class="empty">Нет трамваев на линии</div>';
                return;
            }
            
            // Сортируем по расстоянию до Гагарина
            var sorted = [...trams].sort(function(a, b) {
                var distA = haversine(53.398, 58.978, a.lat, a.lng);
                var distB = haversine(53.398, 58.978, b.lat, b.lng);
                return distA - distB;
            });
            
            var html = '<div class="tram-list">';
            
            sorted.forEach(function(t) {
                var isMoving = t.speed > 0;
                var distToGagarina = Math.round(haversine(53.398, 58.978, t.lat, t.lng));
                var eta = '';
                if (isMoving && t.speed > 0) {
                    eta = '⏱ ~' + Math.round(distToGagarina / (t.speed * 1000 / 60)) + ' мин';
                }
                
                html += '<div class="tram-row ' + (isMoving ? '' : 'stopped') + '" ' +
                    'onclick="focusOnTram(\'' + (t.deviceCode || t.gosNum) + '\', ' + t.lat + ', ' + t.lng + ')" ' +
                    'id="tram-row-' + (t.deviceCode || t.gosNum) + '">';
                html += '<span class="tram-route-num">№' + t.rnum + '</span>';
                html += '<span>' + (isMoving ? t.speed + ' км/ч' : 'Стоит') + '</span>';
                html += '<span class="tram-dist">' + distToGagarina + 'м</span>';
                if (eta) html += '<span class="tram-eta">' + eta + '</span>';
                html += '</div>';
            });
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        // Функция для фокуса на трамвае при клике в списке
        window.focusOnTram = function(id, lat, lng) {
            map.flyTo([lat, lng], 16, { duration: 0.8 });
            
            // Подсветка строки в списке
            var rows = document.querySelectorAll('.tram-row');
            rows.forEach(function(r) { r.classList.remove('highlight'); });
            var row = document.getElementById('tram-row-' + id);
            if (row) row.classList.add('highlight');
            
            // Открываем popup маркера
            var marker = tramMarkers[id];
            if (marker) {
                marker.openPopup();
            }
        };
        
        function haversine(lat1, lng1, lat2, lng2) {
            var R = 6371000;
            var dlat = (lat2 - lat1) * Math.PI / 180;
            var dlng = (lng2 - lng1) * Math.PI / 180;
            var a = Math.sin(dlat/2) * Math.sin(dlat/2) + 
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dlng/2) * Math.sin(dlng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function closeWindow() {
            try {
                if (window.parent && window.parent !== window) {
                    var modal = window.parent.document.getElementById('tramModal');
                    if (modal) window.parent.document.body.removeChild(modal);
                    var closeBtn = window.parent.document.querySelector('button[style*="z-index: 10000"]');
                    if (closeBtn) window.parent.document.body.removeChild(closeBtn);
                }
            } catch(e) {}
        }
        
        // ==================== ЗАПУСК ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            // Обновление каждые 15 секунд
            setInterval(loadData, 15000);
        });
        
        // Обработчик клика по карте — сброс подсветки
        map.on('click', function() {
            var rows = document.querySelectorAll('.tram-row');
            rows.forEach(function(r) { r.classList.remove('highlight'); });
        });
        
    })();
    </script>
</body>
</html>
