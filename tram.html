<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    <style>
        :root {
            --bg: #0A0A14;
            --card: #141428;
            --gold: #FFD700;
            --blue: #58A6FF;
            --red: #FF6B6B;
            --green: #4CAF50;
            --text: #CCC;
            --border: #2A2A4A;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
        }
        
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { color: var(--gold); font-size: 22px; margin-bottom: 4px; }
        .header .subtitle { color: #888; font-size: 13px; }
        
        .stop-selector { display: flex; gap: 8px; margin-bottom: 16px; }
        .stop-btn {
            flex: 1; padding: 12px 8px;
            border: 2px solid var(--border); background: var(--card);
            color: var(--text); border-radius: 12px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all 0.2s;
            text-align: center; white-space: nowrap;
        }
        .stop-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
        
        .loading { text-align: center; padding: 40px; color: #888; }
        .loading .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border); border-top-color: var(--gold);
            border-radius: 50%; animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tram-list { display: flex; flex-direction: column; gap: 10px; }
        .tram-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 14px; cursor: pointer;
            transition: all 0.2s;
        }
        .tram-card.approaching { border-left: 3px solid var(--green); }
        .tram-card.moving-away { border-left: 3px solid var(--red); opacity: 0.5; }
        .tram-card.unknown { border-left: 3px solid var(--gold); }
        
        .tram-main { display: flex; justify-content: space-between; align-items: center; }
        .tram-route { font-size: 20px; font-weight: bold; color: var(--gold); }
        .tram-speed { font-size: 14px; font-weight: 600; }
        .tram-speed.moving { color: var(--green); }
        .tram-speed.stopped { color: var(--red); }
        
        .tram-details { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; color: #888; }
        .tram-distance { color: var(--blue); font-weight: 600; }
        .tram-eta { color: var(--blue); font-weight: 600; font-size: 14px; }
        .tram-status { font-size: 11px; margin-top: 4px; }
        .tram-status.approaching { color: var(--green); }
        .tram-status.moving-away { color: var(--red); }
        .tram-status.unknown { color: var(--gold); }
        
        .empty { text-align: center; padding: 60px 20px; color: #666; }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }
        .error { background: rgba(255,107,107,0.1); border: 1px solid var(--red); padding: 12px; border-radius: 8px; color: var(--red); text-align: center; }
        
        .update-time { text-align: center; font-size: 12px; color: #555; margin: 12px 0; }
        
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; gap: 8px; z-index: 100;
        }
        .btn {
            padding: 14px 16px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); border-radius: 10px;
            cursor: pointer; font-size: 15px; font-weight: 600;
            transition: all 0.2s; text-align: center;
        }
        .btn-refresh { flex: 1; background: var(--blue); color: #000; border: none; }
        .btn-close { flex: 1; background: var(--red); color: #fff; border: none; }
        
        .stats {
            background: #1A1A2E; padding: 8px 12px; border-radius: 8px;
            margin-bottom: 10px; font-size: 12px; color: #888; text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle" id="stopLabel">Выбери остановку</div>
    </div>
    
    <div class="stop-selector">
        <button class="stop-btn active" onclick="selectStop('gagarina', this)">🏫 Гагарина</button>
        <button class="stop-btn" onclick="selectStop('yunost', this)">🎓 Юность</button>
        <button class="stop-btn" onclick="selectStop('ploshchad_mira', this)">🌍 Пл. Мира</button>
    </div>
    
    <div id="tramContent">
        <div class="loading"><div class="spinner"></div>Загружаем данные...</div>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div class="bottom-bar">
        <button class="btn btn-refresh" onclick="loadTrams()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>
    
    <script>
        // ==================== КОНФИГУРАЦИЯ ОСТАНОВОК ====================
        const STOPS = {
            gagarina: {
                name: 'Гагарина',
                lat: 53.398,
                lng: 58.978,
                routes: [1, 5, 6, 7, 9, 10, 11, 15, 17, 20, 22, 23, 24, 27, 29, 31, 33]
            },
            yunost: {
                name: 'Юность',
                lat: 53.416,
                lng: 58.985,
                routes: [7, 9, 15, 17, 20, 22, 24, 27, 29, 31]
            },
            ploshchad_mira: {
                name: 'Пл. Мира',
                lat: 53.405,
                lng: 58.985,
                routes: [1, 3, 11, 14, 16, 20, 22, 33]
            }
        };
        
        let currentStop = 'gagarina';
        let allTrams = [];
        
        // ==================== ИСТОРИЯ ТРАМВАЕВ ====================
        // Хранит для каждого трамвая (по deviceCode) предыдущее расстояние и статус
        let tramHistory = {};
        
        // ==================== API ====================
        const API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        const PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 518062000668,
                rids: '1,3,5,7,9,11,12,14,21,22,23,25,10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 0
            }
        };
        
        // ==================== ФУНКЦИИ ====================
        function selectStop(stopId, btn) {
            currentStop = stopId;
            document.querySelectorAll('.stop-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('stopLabel').textContent = STOPS[stopId].name;
            // Очищаем историю при смене остановки
            tramHistory = {};
            filterAndRender();
        }
        
        async function loadTrams() {
            const content = document.getElementById('tramContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Загружаем данные...</div>';
            
            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                const data = await resp.json();
                
                if (data.r === 'ok') {
                    const stopRoutes = STOPS[currentStop].routes;
                    allTrams = data.data.anims.filter(v => {
                        if (v.rtype !== 'Тм') return false;
                        const rnum = parseInt(v.rnum);
                        return stopRoutes.includes(rnum);
                    });
                    
                    // Обновляем историю
                    updateHistory();
                    
                    filterAndRender();
                    
                    const now = new Date();
                    document.getElementById('updateTime').textContent = 
                        '🕐 Обновлено: ' + now.toLocaleTimeString('ru-RU');
                } else {
                    content.innerHTML = '<div class="error">❌ Ошибка API</div>';
                }
            } catch (e) {
                console.error(e);
                content.innerHTML = '<div class="error">❌ Ошибка загрузки данных</div>';
            }
        }
        
        function updateHistory() {
            const stop = STOPS[currentStop];
            
            allTrams.forEach(tram => {
                const id = tram.deviceCode || tram.gosNum;
                const newDist = haversine(stop.lat, stop.lng, tram.lat, tram.lng);
                
                if (tramHistory[id]) {
                    // Сравниваем с предыдущим расстоянием
                    const prevDist = tramHistory[id].distance;
                    if (newDist < prevDist - 5) {
                        // Расстояние уменьшается — приближается
                        tramHistory[id].status = 'approaching';
                    } else if (newDist > prevDist + 5) {
                        // Расстояние увеличивается — удаляется
                        tramHistory[id].status = 'moving_away';
                    } else {
                        // Стоит на месте — сохраняем предыдущий статус или unknown
                        tramHistory[id].status = tramHistory[id].status || 'unknown';
                    }
                    tramHistory[id].distance = newDist;
                    tramHistory[id].lastSeen = Date.now();
                } else {
                    // Первое появление — статус неизвестен
                    tramHistory[id] = {
                        distance: newDist,
                        status: 'unknown',
                        firstSeen: Date.now(),
                        lastSeen: Date.now()
                    };
                }
            });
            
            // Очищаем трамваи, которые не видели больше 10 минут
            const now = Date.now();
            for (let id in tramHistory) {
                if (now - tramHistory[id].lastSeen > 600000) {
                    delete tramHistory[id];
                }
            }
        }
        
        function filterAndRender() {
            const stop = STOPS[currentStop];
            const content = document.getElementById('tramContent');
            
            if (allTrams.length === 0) {
                content.innerHTML = '<div class="empty"><div class="icon">🚋</div>Нет данных о трамваях</div>';
                return;
            }
            
            // Добавляем расстояние и статус из истории
            let enriched = allTrams.map(tram => {
                const id = tram.deviceCode || tram.gosNum;
                const dist = haversine(stop.lat, stop.lng, tram.lat, tram.lng);
                const history = tramHistory[id];
                const status = history ? history.status : 'unknown';
                
                // ETA
                let etaMinutes = Infinity;
                if (tram.speed > 0) {
                    etaMinutes = dist / (tram.speed * 1000 / 60);
                }
                
                return { ...tram, _dist: dist, _status: status, _eta: etaMinutes, _id: id };
            });
            
            // === ДВУХСТУПЕНЧАТАЯ ПРОВЕРКА (твоя идея) ===
            
            // Шаг 1: Оставляем только те, что приближаются или неизвестны
            let filtered = enriched.filter(t => t._status === 'approaching' || t._status === 'unknown');
            
            // Если приближающихся нет — показываем всех (чтобы не было пустого экрана)
            if (filtered.length === 0) {
                filtered = [...enriched];
            }
            
            // Шаг 2: Сортируем по ETA (кто быстрее приедет)
            // Приближающиеся первее, неизвестные — в конец
            filtered.sort((a, b) => {
                if (a._status === 'approaching' && b._status !== 'approaching') return -1;
                if (a._status !== 'approaching' && b._status === 'approaching') return 1;
                if (!isFinite(a._eta) && !isFinite(b._eta)) return a._dist - b._dist;
                if (!isFinite(a._eta)) return 1;
                if (!isFinite(b._eta)) return -1;
                return a._eta - b._eta;
            });
            
            // Статистика
            const approaching = enriched.filter(t => t._status === 'approaching').length;
            const away = enriched.filter(t => t._status === 'moving_away').length;
            const unknown = enriched.filter(t => t._status === 'unknown').length;
            
            // Отрисовка
            let html = '';
            
            html += '<div class="stats">';
            html += `🟢 Приближаются: <b>${approaching}</b> | `;
            html += `🔴 Удаляются: <b>${away}</b> | `;
            html += `🟡 Неизвестно: <b>${unknown}</b>`;
            html += '</div>';
            
            html += '<div class="tram-list">';
            
            filtered.forEach(t => {
                const isMoving = (t.speed || 0) > 0;
                const statusClass = t._status === 'approaching' ? 'approaching' : (t._status === 'moving_away' ? 'moving-away' : 'unknown');
                const speedClass = isMoving ? 'moving' : 'stopped';
                const speedText = isMoving ? `${t.speed} км/ч` : 'Стоит';
                
                let etaText = '';
                if (isFinite(t._eta)) {
                    const minutes = Math.round(t._eta);
                    if (minutes < 1) etaText = '⏱ < 1 мин';
                    else if (minutes < 60) etaText = `⏱ ~${minutes} мин`;
                    else etaText = '⏱ > 1 ч';
                }
                
                let statusText = '';
                if (t._status === 'approaching') statusText = '✅ Приближается';
                else if (t._status === 'moving_away') statusText = '🔴 Удаляется';
                else statusText = '🟡 Первое появление';
                
                html += `
                    <div class="tram-card ${statusClass}" onclick="openMap(${t.lat}, ${t.lng})">
                        <div class="tram-main">
                            <span class="tram-route">№${t.rnum || '?'}</span>
                            <span class="tram-speed ${speedClass}">${speedText}</span>
                        </div>
                        <div class="tram-details">
                            <span class="tram-distance">📍 ${Math.round(t._dist)}м</span>
                            ${etaText ? `<span class="tram-eta">${etaText}</span>` : ''}
                        </div>
                        <div class="tram-status ${statusClass}">${statusText}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            content.innerHTML = html;
        }
        
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dlat = (lat2 - lat1) * Math.PI / 180;
            const dlng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dlat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dlng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function openMap(lat, lng) {
            window.open(`https://maps.yandex.ru/?ll=${lng},${lat}&z=16`, '_blank');
        }
        
        function closeWindow() {
            if (window.parent && window.parent !== window) {
                const modal = window.parent.document.getElementById('tramModal');
                if (modal) window.parent.document.body.removeChild(modal);
                const closeBtn = window.parent.document.querySelector('button[style*="position: fixed"][style*="z-index: 10000"]');
                if (closeBtn) window.parent.document.body.removeChild(closeBtn);
            }
        }
        
        // Загружаем при открытии
        document.addEventListener('DOMContentLoaded', loadTrams);
        
        // Автообновление каждые 30 секунд
        setInterval(loadTrams, 30000);
    </script>
</body>
</html>
