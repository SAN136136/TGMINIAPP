<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    <style>
        :root {
            --bg: #0A0A14;
            --card: #141428;
            --gold: #FFD700;
            --blue: #58A6FF;
            --red: #FF6B6B;
            --text: #CCC;
            --border: #2A2A4A;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: var(--gold);
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .header .subtitle {
            color: #888;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        
        .btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }
        
        .btn-refresh {
            margin-left: auto;
            background: var(--blue);
            color: #000;
            border: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tram-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .tram-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .tram-card:hover {
            border-color: var(--gold);
            transform: translateX(4px);
        }
        
        .tram-card.moving {
            border-left: 3px solid #4CAF50;
        }
        
        .tram-card.stopped {
            border-left: 3px solid var(--red);
        }
        
        .tram-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .tram-route {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .tram-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .tram-badge.moving {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        
        .tram-badge.stopped {
            background: rgba(255, 107, 107, 0.2);
            color: var(--red);
        }
        
        .tram-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 13px;
        }
        
        .tram-info .label {
            color: #888;
        }
        
        .tram-info .value {
            color: var(--text);
            text-align: right;
        }
        
        .tram-direction {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: #888;
        }
        
        .tram-direction .arrow {
            font-size: 16px;
            margin-right: 4px;
        }
        
        .tram-direction .eta {
            color: var(--blue);
            float: right;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--red);
            padding: 12px;
            border-radius: 8px;
            color: var(--red);
            text-align: center;
        }
        
        .update-time {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle">Гагарина → Юность</div>
    </div>
    
    <div class="controls">
        <button class="btn active" onclick="filterTrams('all', this)">Все</button>
        <button class="btn" onclick="filterTrams('moving', this)">🟢 В пути</button>
        <button class="btn" onclick="filterTrams('stopped', this)">🔴 Стоят</button>
        <button class="btn btn-refresh" onclick="loadTrams()">🔄 Обновить</button>
    </div>
    
    <div id="tramContent">
        <div class="loading">
            <div class="spinner"></div>
            Загружаем данные...
        </div>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <script>
        // Данные о всех трамваях
        let allTrams = [];
        let currentFilter = 'all';
        
        // Загружаем данные при открытии
        document.addEventListener('DOMContentLoaded', loadTrams);
        
        async function loadTrams() {
            const content = document.getElementById('tramContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Загружаем данные...</div>';
            
            try {
                // Отправляем команду через Telegram
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.sendData(JSON.stringify({ command: 'get_trams' }));
                    
                    // Ждём ответа через callback
                    window.tramCallback = function(data) {
                        renderTrams(data);
                    };
                } else {
                    // Для теста — моковые данные
                    const mockData = [
                        { route: '21', board: '3198', speed: 25, lat: 53.398, lng: 58.978, direction: 90, status: 'moving' },
                        { route: '15', board: '3205', speed: 0, lat: 53.405, lng: 58.985, direction: 180, status: 'stopped' },
                        { route: '7', board: '3244', speed: 31, lat: 53.392, lng: 59.005, direction: 270, status: 'moving' },
                    ];
                    renderTrams(mockData);
                }
            } catch (e) {
                content.innerHTML = '<div class="error">❌ Ошибка загрузки данных</div>';
            }
        }
        
        function renderTrams(trams) {
            allTrams = trams;
            const content = document.getElementById('tramContent');
            
            // Фильтруем только трамваи, едущие от Гагарина к Юности
            // (примерные координаты коридора)
            const filtered = trams.filter(t => {
                const lat = t.lat || 0;
                const lng = t.lng || 0;
                // Коридор Гагарина-Юность: широта 53.38-53.42, долгота 58.97-59.01
                return lat > 53.38 && lat < 53.42 && lng > 58.97 && lng < 59.01;
            });
            
            applyFilter(filtered);
            
            // Время обновления
            const now = new Date();
            document.getElementById('updateTime').textContent = 
                `🕐 Обновлено: ${now.toLocaleTimeString('ru-RU')}`;
        }
        
        function applyFilter(sourceData) {
            const content = document.getElementById('tramContent');
            let data = [...sourceData];
            
            // Применяем текущий фильтр
            if (currentFilter === 'moving') {
                data = data.filter(t => (t.speed || 0) > 0);
            } else if (currentFilter === 'stopped') {
                data = data.filter(t => (t.speed || 0) === 0);
            }
            
            if (data.length === 0) {
                content.innerHTML = '<div class="empty"><div class="icon">🚋</div>Нет трамваев в выбранном направлении</div>';
                return;
            }
            
            // Сортируем по расстоянию (чем ближе к Юности — тем ближе lat к 53.42)
            data.sort((a, b) => (b.lat || 0) - (a.lat || 0));
            
            let html = '<div class="tram-list">';
            
            data.forEach((tram, index) => {
                const isMoving = (tram.speed || 0) > 0;
                const statusClass = isMoving ? 'moving' : 'stopped';
                const badgeClass = isMoving ? 'moving' : 'stopped';
                const badgeText = isMoving ? '🟢 В пути' : '🔴 Стоит';
                
                // Направление в стрелку
                const dir = tram.direction || 0;
                const arrows = ['⬆️', '↗️', '➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️'];
                const arrow = arrows[Math.round(dir / 45) % 8] || '🔄';
                
                // Примерное время до Юности (lat ~53.416)
                const distToTarget = Math.abs((tram.lat || 0) - 53.416) * 111000; // в метрах
                let eta = '';
                if (isMoving && tram.speed > 0) {
                    const minutes = Math.round(distToTarget / (tram.speed * 1000 / 60));
                    if (minutes > 0) eta = `⏱ ~${minutes} мин`;
                }
                
                html += `
                    <div class="tram-card ${statusClass}" onclick="openMap(${tram.lat}, ${tram.lng})">
                        <div class="tram-header">
                            <span class="tram-route">№${tram.route || '?'}</span>
                            <span class="tram-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="tram-info">
                            <span class="label">Борт:</span>
                            <span class="value">${tram.board || '?'}</span>
                            <span class="label">Скорость:</span>
                            <span class="value">${tram.speed || 0} км/ч</span>
                        </div>
                        <div class="tram-direction">
                            <span class="arrow">${arrow}</span>
                            ${dir}°
                            ${eta ? `<span class="eta">${eta}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            content.innerHTML = html;
        }
        
        function filterTrams(type, btn) {
            currentFilter = type;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Применяем фильтр
            applyFilter(allTrams);
        }
        
        function openMap(lat, lng) {
            const url = `https://maps.yandex.ru/?ll=${lng},${lat}&z=16`;
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
