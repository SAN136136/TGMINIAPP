<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамваи Магнитогорска</title>
    <style>
        :root {
            --bg: #0A0A14;
            --card: #141428;
            --gold: #FFD700;
            --blue: #58A6FF;
            --red: #FF6B6B;
            --text: #CCC;
            --border: #2A2A4A;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .header h1 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 4px;
        }
        
        .header .subtitle {
            color: #888;
            font-size: 13px;
        }
        
        .stop-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        
        .stop-btn {
            flex: 1;
            padding: 12px 8px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            min-width: 0;
            white-space: nowrap;
        }
        
        .stop-btn:hover {
            border-color: var(--gold);
        }
        
        .stop-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tram-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .tram-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tram-card.moving {
            border-left: 3px solid #4CAF50;
        }
        
        .tram-card.stopped {
            border-left: 3px solid var(--red);
        }
        
        .tram-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .tram-route {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
        }
        
        .tram-speed {
            font-size: 14px;
            font-weight: 600;
        }
        
        .tram-speed.moving {
            color: #4CAF50;
        }
        
        .tram-speed.stopped {
            color: var(--red);
        }
        
        .tram-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 13px;
            color: #888;
        }
        
        .tram-distance {
            color: var(--blue);
            font-weight: 600;
        }
        
        .tram-eta {
            color: var(--blue);
            font-weight: 600;
            font-size: 14px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--red);
            padding: 12px;
            border-radius: 8px;
            color: var(--red);
            text-align: center;
        }
        
        .update-time {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin: 12px 0;
        }
        
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        
        .btn {
            padding: 14px 16px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }
        
        .btn-refresh {
            flex: 1;
            background: var(--blue);
            color: #000;
            border: none;
        }
        
        .btn-close {
            flex: 1;
            background: var(--red);
            color: #fff;
            border: none;
        }
        
        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 12px;
            color: #888;
        }
        
        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .legend .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚋 Трамваи Магнитогорска</h1>
        <div class="subtitle" id="stopLabel">Выбери остановку</div>
    </div>
    
    <div class="stop-selector">
        <button class="stop-btn active" onclick="selectStop('gagarina', this)">🏫 Гагарина</button>
        <button class="stop-btn" onclick="selectStop('yunost', this)">🎓 Юность</button>
        <button class="stop-btn" onclick="selectStop('ploshchad_mira', this)">🌍 Пл. Мира</button>
    </div>
    
    <div class="legend">
        <span><span class="dot" style="background:#4CAF50;"></span> Едет</span>
        <span><span class="dot" style="background:#FF6B6B;"></span> Стоит</span>
    </div>
    
    <div id="tramContent">
        <div class="loading">
            <div class="spinner"></div>
            Загружаем данные...
        </div>
    </div>
    
    <div class="update-time" id="updateTime"></div>
    
    <div class="bottom-bar">
        <button class="btn btn-refresh" onclick="loadTrams()">🔄 Обновить</button>
        <button class="btn btn-close" onclick="closeWindow()">✕ Закрыть</button>
    </div>
    
    <script>
        // ==================== КОНФИГУРАЦИЯ ОСТАНОВОК ====================
        const STOPS = {
            gagarina: {
                name: 'Гагарина',
                lat: 53.398,
                lng: 58.978,
                routes: [1, 5, 11, 15, 17],
                targetDirection: 'south'
            },
            yunost: {
                name: 'Юность',
                lat: 53.416,
                lng: 58.985,
                routes: [1, 5, 11, 15, 17],
                targetDirection: 'north'
            },
            ploshchad_mira: {
                name: 'Пл. Мира',
                lat: 53.405,
                lng: 58.985,
                routes: [1, 5, 11, 15, 17],
                targetDirection: 'south'
            }
        };
        
        let currentStop = 'gagarina';
        let allTrams = [];
        
        // ==================== API ====================
        const API_URL = 'https://smarttransport.online/magnitogorsk/php/apiRequest.php?getVehiclesAnimation.php';
        const PAYLOAD = {
            t: '11111111-50b3-4fec-b922-8a50a1d38366',
            ct: 26,
            cd: 'getVehiclesAnimation.php',
            reg: 74004,
            data: {
                wuid: 798382819222,
                rids: '10001,10002,10004,10006,10007,10009,10011,10013,10017,10021,10023,10024,10026,10029,10031,10032,10035,10037,10039,10040,10041,10042,10043,10045,10046,10047,10051,10053,10055,10057,10058,10060,10061,10063,10067,10069,10070,10080,10082,10083,10091,10094,10097,10099,10100,10101,10103,10106,10107,10126',
                curk: 167713
            }
        };
        
        // ==================== ФУНКЦИИ ====================
        function selectStop(stopId, btn) {
            currentStop = stopId;
            document.querySelectorAll('.stop-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('stopLabel').textContent = STOPS[stopId].name;
            filterAndRender();
        }
        
        async function loadTrams() {
            const content = document.getElementById('tramContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Загружаем данные...</div>';
            
            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(PAYLOAD)
                });
                const data = await resp.json();
                
                if (data.r === 'ok') {
                    const stopRoutes = STOPS[currentStop].routes;
                    allTrams = data.data.anims.filter(v => {
                        if (v.rtype !== 'Тм') return false;
                        const rnum = parseInt(v.rnum);
                        return stopRoutes.includes(rnum);
                    });
                    filterAndRender();
                    
                    const now = new Date();
                    document.getElementById('updateTime').textContent = 
                        '🕐 Обновлено: ' + now.toLocaleTimeString('ru-RU');
                } else {
                    content.innerHTML = '<div class="error">❌ Ошибка API</div>';
                }
            } catch (e) {
                console.error(e);
                content.innerHTML = '<div class="error">❌ Ошибка загрузки данных</div>';
            }
        }
        
        function filterAndRender() {
            const stop = STOPS[currentStop];
            const content = document.getElementById('tramContent');
            
            if (allTrams.length === 0) {
                content.innerHTML = '<div class="empty"><div class="icon">🚋</div>Нет данных о трамваях</div>';
                return;
            }
            
            // Фильтруем по направлению движения
            let filtered = allTrams.filter(t => {
                const dir = t.dir || 0;
                
                if (stop.targetDirection === 'south') {
                    // Направление на юг: 135° - 225°
                    const isSouth = dir >= 135 && dir <= 225;
                    // Трамвай еще не проехал остановку (находится севернее)
                    const isNorthOfStop = t.lat < stop.lat;
                    return isSouth && isNorthOfStop;
                } else if (stop.targetDirection === 'north') {
                    // Направление на север: 0°-45° или 315°-360°
                    const isNorth = dir <= 45 || dir >= 315;
                    // Трамвай еще не проехал остановку (находится южнее)
                    const isSouthOfStop = t.lat > stop.lat;
                    return isNorth && isSouthOfStop;
                }
                
                return false;
            });
            
            if (filtered.length === 0) {
                content.innerHTML = '<div class="empty"><div class="icon">🚋</div>Нет трамваев, следующих в вашу сторону</div>';
                return;
            }
            
            // Считаем расстояние до остановки
            filtered = filtered.map(t => {
                const dist = haversine(stop.lat, stop.lng, t.lat, t.lng);
                return { ...t, _dist: dist };
            });
            
            // Сортируем по расстоянию
            filtered.sort((a, b) => a._dist - b._dist);
            
            // Отрисовка
            let html = '<div class="tram-list">';
            
            filtered.forEach(t => {
                const isMoving = (t.speed || 0) > 0;
                const statusClass = isMoving ? 'moving' : 'stopped';
                const speedClass = isMoving ? 'moving' : 'stopped';
                const speedText = isMoving ? `${t.speed} км/ч` : 'Стоит';
                
                let eta = '';
                if (isMoving && t.speed > 0) {
                    const minutes = Math.round(t._dist / (t.speed * 1000 / 60));
                    if (minutes > 0 && minutes < 120) eta = `⏱ ~${minutes} мин`;
                }
                
                html += `
                    <div class="tram-card ${statusClass}" onclick="openMap(${t.lat}, ${t.lng})">
                        <div class="tram-main">
                            <span class="tram-route">№${t.rnum || '?'}</span>
                            <span class="tram-speed ${speedClass}">${speedText}</span>
                        </div>
                        <div class="tram-details">
                            <span class="tram-distance">📍 ${Math.round(t._dist)}м до ост.</span>
                            ${eta ? `<span class="tram-eta">${eta}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            content.innerHTML = html;
        }
        
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dlat = (lat2 - lat1) * Math.PI / 180;
            const dlng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dlat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dlng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function openMap(lat, lng) {
            window.open(`https://maps.yandex.ru/?ll=${lng},${lat}&z=16`, '_blank');
        }
        
        function closeWindow() {
            if (window.parent && window.parent !== window) {
                const modal = window.parent.document.getElementById('tramModal');
                if (modal) window.parent.document.body.removeChild(modal);
                const closeBtn = window.parent.document.querySelector('button[style*="position: fixed"][style*="z-index: 10000"]');
                if (closeBtn) window.parent.document.body.removeChild(closeBtn);
            }
        }
        
        // Загружаем при открытии
        document.addEventListener('DOMContentLoaded', loadTrams);
    </script>
</body>
</html>
