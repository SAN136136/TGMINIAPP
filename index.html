<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Client</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <h1>JARVIS</h1>
    <input type="password" id="pinInput" placeholder="Пароль" maxlength="20">
    <br>
    <button onclick="checkPassword()">ВОЙТИ</button>
    <div id="loginError"></div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="mainScreen">
    <div class="header">
        <h1>JARVIS</h1>
        <span class="status" id="statusIndicator">🟢</span>
    </div>
    
    <div class="greeting" id="greeting">Доброе утро, сэр!</div>
    
    <div class="current-lesson" id="currentLesson">
        <div class="lesson-subject" id="lessonSubject"></div>
        <div class="lesson-details" id="lessonDetails"></div>
    </div>
    
    <div class="log" id="log">[Готов к работе]</div>
    
    <div class="tab-content" id="tabContent"></div>
    
    <div class="cmd-bar">
        <input type="text" id="cmdInput" placeholder="Своя команда...">
        <button onclick="sendCommand(document.getElementById('cmdInput').value)">▶</button>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('main')">🏠</button>
        <button class="nav-btn" onclick="switchTab('control')">🎮</button>
        <button class="nav-btn" onclick="switchTab('school')">📚</button>
        <button class="nav-btn" onclick="switchTab('music')">🎵</button>
        <button class="nav-btn" onclick="switchTab('tools')">⚙️</button>
    </div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div class="modal-overlay" id="scheduleModal">
    <div class="modal">
        <h2>📅 Расписание</h2>
        <div id="scheduleContent"></div>
        <button class="modal-close" onclick="closeSchedule()">Закрыть</button>
    </div>
</div>

<div class="modal-overlay" id="lessonDetailModal">
    <div class="modal">
        <h2 id="lessonDetailTitle"></h2>
        <div id="lessonDetailContent"></div>
        <button class="modal-close" onclick="closeLessonDetail()">Закрыть</button>
    </div>
</div>

<div class="modal-overlay" id="cheatsheetModal">
    <div class="modal">
        <div id="cheatsheetContent"></div>
        <button class="modal-close" onclick="closeCheatsheet()">Закрыть</button>
    </div>
</div>

<!-- КАЛЬКУЛЯТОР -->
<div class="modal-overlay" id="calcModal">
    <div class="modal calc-modal">
        <h2>🧮 Калькулятор</h2>
        
        <div class="calc-mode-bar">
            <button class="calc-mode-btn active" data-mode="basic" onclick="switchCalcMode('basic')">🧮</button>
            <button class="calc-mode-btn" data-mode="equations" onclick="switchCalcMode('equations')">❌</button>
            <button class="calc-mode-btn" data-mode="geometry" onclick="switchCalcMode('geometry')">📐</button>
            <button class="calc-mode-btn" data-mode="physics" onclick="switchCalcMode('physics')">⚡</button>
            <button class="calc-mode-btn" data-mode="converter" onclick="switchCalcMode('converter')">📏</button>
            <button class="calc-mode-btn" data-mode="graph" onclick="switchCalcMode('graph')">📊</button>
        </div>
        
        <div class="calc-display" id="calcDisplay" contenteditable="false">0</div>
        <div class="calc-result" id="calcResult"></div>
        
        <!-- ГЕОМЕТРИЯ -->
        <div id="calcGeoInputs" style="display:none;">
            <select id="geoShape" onchange="switchGeoShape()" class="calc-select" style="margin-bottom:8px;">
                <option value="circle">Круг</option>
                <option value="triangle">Треугольник</option>
                <option value="rectangle">Прямоугольник</option>
                <option value="cylinder">Цилиндр</option>
            </select>
            <div id="geoTable" style="display:none;"></div>
            <div id="geoError" style="color:#FF5555; font-size:12px; text-align:center; margin-top:5px;"></div>
            <div id="geoCalcPad" style="display:none;">
                <div class="calc-buttons" id="geoAdvancedRow" style="display:none; margin-top:5px;">
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('+')">+</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('−')">−</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('×')">×</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('÷')">÷</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('(')">(</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput(')')">)</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('sqrt(')">√</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('^2')">x²</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('pi')">π</button>
                    <button class="calc-btn calc-btn-func" onclick="geoCalcInput('.')">.</button>
                </div>
                <div class="calc-buttons" style="margin-top:5px;">
                    <button class="calc-btn calc-btn-clear" onclick="geoCalcClear()">C</button>
                    <button class="calc-btn calc-btn-clear" onclick="geoCalcBackspace()">⌫</button>
                    <button class="calc-btn calc-btn-func" onclick="toggleGeoAdvanced()">···</button>
                    <button class="calc-btn" onclick="geoCalcInput('7')">7</button>
                    <button class="calc-btn" onclick="geoCalcInput('8')">8</button>
                    <button class="calc-btn" onclick="geoCalcInput('9')">9</button>
                    <button class="calc-btn" onclick="geoCalcInput('4')">4</button>
                    <button class="calc-btn" onclick="geoCalcInput('5')">5</button>
                    <button class="calc-btn" onclick="geoCalcInput('6')">6</button>
                    <button class="calc-btn" onclick="geoCalcInput('1')">1</button>
                    <button class="calc-btn" onclick="geoCalcInput('2')">2</button>
                    <button class="calc-btn" onclick="geoCalcInput('3')">3</button>
                    <button class="calc-btn" onclick="geoCalcInput('0')">0</button>
                </div>
            </div>
        </div>
        
        <!-- ФИЗИКА -->
        <div id="calcPhysInputs" style="display:none;">
            <div id="physSolver"></div>
        </div>
        
        <!-- УРАВНЕНИЯ -->
        <div id="calcEqInputs" style="display:none;">
            <div style="display:flex; gap:6px; margin-bottom:10px;">
                <button class="calc-mode-btn eq-type-btn active" id="eqType_linear" onclick="switchEqType('linear')">Линейные</button>
                <button class="calc-mode-btn eq-type-btn" id="eqType_quadratic" onclick="switchEqType('quadratic')">Квадратные</button>
                <button class="calc-mode-btn eq-type-btn" id="eqType_system" onclick="switchEqType('system')">Системы</button>
            </div>
            <div id="eqCalcPad">
                <div style="display:flex; gap:8px; margin-bottom:5px;">
                    <input type="text" id="eqInput1" placeholder="" 
                        style="flex:1; padding:14px; background:#0A0A14; border:2px solid #3A5A6B; color:#FFD700; font-size:20px; border-radius:8px; text-align:center; letter-spacing:1px;"
                        onfocus="focusEqInput(1)" onclick="focusEqInput(1)">
                    <button class="calc-btn" onclick="eqPaste()" style="padding:12px 15px; font-size:18px;">📋</button>
                </div>
                <div id="eqInput2Row" style="display:none; gap:8px; margin-bottom:8px;">
                    <input type="text" id="eqInput2" placeholder="" 
                        style="flex:1; padding:14px; background:#0A0A14; border:2px solid #3A5A6B; color:#FFD700; font-size:20px; border-radius:8px; text-align:center; letter-spacing:1px;"
                        onfocus="focusEqInput(2)" onclick="focusEqInput(2)">
                    <div style="width:52px;"></div>
                </div>
                <div class="calc-buttons" style="margin-top:5px;">
                    <button class="calc-btn calc-btn-clear" onclick="eqClear()">C</button>
                    <button class="calc-btn calc-btn-clear" onclick="eqBackspace()">⌫</button>
                    <button class="calc-btn" onclick="eqInput('(')">(</button>
                    <button class="calc-btn" onclick="eqInput(')')">)</button>
                    <button class="calc-btn" onclick="eqInput('7')">7</button>
                    <button class="calc-btn" onclick="eqInput('8')">8</button>
                    <button class="calc-btn" onclick="eqInput('9')">9</button>
                    <button class="calc-btn calc-btn-op" onclick="eqInput('/')">/</button>
                    <button class="calc-btn" onclick="eqInput('4')">4</button>
                    <button class="calc-btn" onclick="eqInput('5')">5</button>
                    <button class="calc-btn" onclick="eqInput('6')">6</button>
                    <button class="calc-btn calc-btn-op" onclick="eqInput('*')">*</button>
                    <button class="calc-btn" onclick="eqInput('1')">1</button>
                    <button class="calc-btn" onclick="eqInput('2')">2</button>
                    <button class="calc-btn" onclick="eqInput('3')">3</button>
                    <button class="calc-btn calc-btn-op" onclick="eqInput('-')">−</button>
                    <button class="calc-btn" onclick="eqInput('0')">0</button>
                    <button class="calc-btn" onclick="eqInput('.')">.</button>
                    <button class="calc-btn calc-btn-eq" onclick="eqSolve()" style="font-size:16px;">Решить</button>
                    <button class="calc-btn calc-btn-op" onclick="eqInput('+')">+</button>
                    <button class="calc-btn calc-btn-func" onclick="eqInput('x')">x</button>
                    <button class="calc-btn calc-btn-func" id="eqYBtn" onclick="eqInput('y')">y</button>
                    <button class="calc-btn calc-btn-func" onclick="eqInput('=')">=</button>
                </div>
            </div>
            <div id="eqSolution" style="display:none;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; background:#1A1A2E; padding:10px; border-radius:8px;">
                    <span style="color:#FFD700; font-size:16px; flex:1;" id="eqOriginal"></span>
                    <button class="calc-btn" onclick="eqEdit()" style="padding:8px 12px; font-size:16px;">✏️</button>
                </div>
                <div id="eqSteps" style="color:#CCC; font-size:14px;"></div>
                <div id="eqAnswer" style="margin-top:10px;"></div>
            </div>
        </div>
        
        <!-- ГРАФИКИ -->
        <div id="calcGraphInputs" style="display:none;">
            <div id="graphInputs"></div>
            
            <div class="calc-buttons" style="margin-top:5px;">
                <button class="calc-btn calc-btn-clear" onclick="graphClear()">C</button>
                <button class="calc-btn calc-btn-clear" onclick="graphBackspace()">⌫</button>
                <button class="calc-btn" onclick="graphInputKey('(')">(</button>
                <button class="calc-btn" onclick="graphInputKey(')')">)</button>
                <button class="calc-btn" onclick="graphInputKey('7')">7</button>
                <button class="calc-btn" onclick="graphInputKey('8')">8</button>
                <button class="calc-btn" onclick="graphInputKey('9')">9</button>
                <button class="calc-btn calc-btn-op" onclick="graphInputKey('/')">/</button>
                <button class="calc-btn" onclick="graphInputKey('4')">4</button>
                <button class="calc-btn" onclick="graphInputKey('5')">5</button>
                <button class="calc-btn" onclick="graphInputKey('6')">6</button>
                <button class="calc-btn calc-btn-op" onclick="graphInputKey('*')">*</button>
                <button class="calc-btn" onclick="graphInputKey('1')">1</button>
                <button class="calc-btn" onclick="graphInputKey('2')">2</button>
                <button class="calc-btn" onclick="graphInputKey('3')">3</button>
                <button class="calc-btn calc-btn-op" onclick="graphInputKey('-')">−</button>
                <button class="calc-btn" onclick="graphInputKey('0')">0</button>
                <button class="calc-btn" onclick="graphInputKey('.')">.</button>
                <button class="calc-btn calc-btn-eq" onclick="drawAllGraphs()" style="font-size:16px;">Обновить</button>
                <button class="calc-btn calc-btn-op" onclick="graphInputKey('+')">+</button>
                <button class="calc-btn calc-btn-func" onclick="graphInputKey('x')">x</button>
                <button class="calc-btn calc-btn-func" onclick="graphInputKey('y')">y</
