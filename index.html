<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D0D14;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        #loginScreen { text-align: center; animation: fadeIn 0.5s ease; }
        #loginScreen h1 { font-size: 36px; color: #58A6FF; margin-bottom: 30px; }
        #loginScreen input {
            padding: 12px 20px; font-size: 18px; border-radius: 8px;
            border: 2px solid #58A6FF; background: #1A1A2E; color: white;
            text-align: center; letter-spacing: 5px; outline: none; width: 200px;
        }
        #loginScreen button {
            display: block; margin: 15px auto 0; padding: 12px 40px;
            font-size: 18px; font-weight: bold; border: none; border-radius: 8px;
            background: #58A6FF; color: white; cursor: pointer; transition: transform 0.1s;
        }
        #loginScreen button:active { transform: scale(0.95); }
        #loginError { color: #FF5555; font-size: 14px; margin-top: 10px; min-height: 20px; }
        
        #mainScreen {
            display: none; flex-direction: column; width: 100%;
            height: 100vh; max-width: 500px; padding: 15px; animation: fadeIn 0.5s ease;
        }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .header h1 { color: #58A6FF; font-size: 24px; }
        .header .status { font-size: 18px; }
        
        .greeting {
            text-align: center; color: #58A6FF; font-size: 16px;
            margin-bottom: 10px; animation: pulse 2s infinite; min-height: 24px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; } 50% { opacity: 1; }
        }
        
        .log {
            background: #1A1A2E; border-radius: 8px; padding: 10px;
            font-size: 13px; color: #B0B0B0; min-height: 30px; margin-bottom: 10px; flex-shrink: 0;
        }
        
        .current-lesson {
            background: #1A2E3A; border-radius: 8px; padding: 10px;
            margin-bottom: 10px; font-size: 13px; color: #58A6FF;
            display: none;
        }
        .current-lesson .lesson-subject { font-size: 16px; font-weight: bold; color: #FFD700; }
        .current-lesson .lesson-details { color: #B0B0B0; margin-top: 4px; }
        
        .tab-content { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .section-title {
            font-size: 11px; color: #666; margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            padding: 12px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: bold; color: white;
            cursor: pointer; transition: all 0.2s; animation: fadeInUp 0.3s ease both;
        }
        .btn:active { transform: scale(0.95); filter: brightness(1.3); }
        .btn-ping { background: #2D8A4E; }
        .btn-status { background: #2D5F8A; }
        .btn-weather { background: #5B8A2D; }
        .btn-news { background: #6B4C8A; }
        .btn-ue5 { background: #C75B2A; }
        .btn-shutdown { background: #C72A2A; }
        .btn-cancel { background: #555; }
        .btn-music { background: #8A2D8A; }
        .btn-music-next { background: #6B3A8A; }
        .btn-music-prev { background: #6B3A8A; }
        .btn-calc { background: #2D6B8A; }
        .btn-schedule { background: #3A6B5A; }
        .btn-cheatsheet { background: #8A6B2D; }
        .btn-tram { background: #8A2D4E; }
        .btn-wip { background: #444; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        
        .cmd-bar { display: flex; gap: 8px; flex-shrink: 0; }
        .cmd-bar input {
            flex: 1; padding: 10px; border-radius: 8px; border: none;
            background: #1A1A2E; color: white; font-size: 14px;
        }
        .cmd-bar button {
            padding: 10px 20px; border: none; border-radius: 8px;
            background: #58A6FF; color: white; font-size: 18px;
            cursor: pointer; transition: transform 0.1s;
        }
        .cmd-bar button:active { transform: scale(0.95); }
        
        .bottom-nav {
            display: flex; justify-content: space-around;
            background: #1A1A2E; border-radius: 12px; padding: 10px 0; flex-shrink: 0;
        }
        .nav-btn {
            background: none; border: none; color: #666; font-size: 22px;
            cursor: pointer; transition: all 0.2s; padding: 5px 15px; border-radius: 8px;
        }
        .nav-btn.active { color: #58A6FF; background: rgba(88, 166, 255, 0.1); }
        .music-hint { color: #666; font-size: 11px; text-align: center; margin-top: 15px; }
        .wip-badge {
            display: inline-block; background: #FFAA00; color: #000;
            font-size: 9px; padding: 2px 6px; border-radius: 4px;
            margin-left: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <h1>JARVIS</h1>
    <input type="password" id="pinInput" placeholder="Пароль" maxlength="20">
    <br>
    <button onclick="checkPassword()">ВОЙТИ</button>
    <div id="loginError"></div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="mainScreen">
    <div class="header">
        <h1>JARVIS</h1>
        <span class="status">🟢</span>
    </div>
    
    <div class="greeting" id="greeting">Доброе утро, сэр!</div>
    
    <!-- Блок текущего урока -->
    <div class="current-lesson" id="currentLesson">
        <div class="lesson-subject" id="lessonSubject"></div>
        <div class="lesson-details" id="lessonDetails"></div>
    </div>
    
    <div class="log" id="log">[Готов к работе]</div>
    
    <div class="tab-content" id="tabContent"></div>
    
    <div class="cmd-bar">
        <input type="text" id="cmdInput" placeholder="Своя команда...">
        <button onclick="sendCommand(document.getElementById('cmdInput').value)">▶</button>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('main')">🏠</button>
        <button class="nav-btn" onclick="switchTab('control')">🎮</button>
        <button class="nav-btn" onclick="switchTab('school')">📚</button>
        <button class="nav-btn" onclick="switchTab('music')">🎵</button>
        <button class="nav-btn" onclick="switchTab('tools')">⚙️</button>
    </div>
</div>

<script>
    // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
    let BOT_TOKEN = "";
    let CHANNEL_ID = "";
    let API_URL = "";
    let activeTab = "main";
    let lastUpdateId = 0;
    let scheduleData = null;
    const PASSWORD = "пельмень";
    
    // ==================== ЗАГРУЗКА КОНФИГА И РАСПИСАНИЯ ====================
    fetch('gitconfig.json')
        .then(response => response.json())
        .then(config => {
            BOT_TOKEN = config.telegram.client_bot_token;
            CHANNEL_ID = config.telegram.channel_id;
            API_URL = `https://api.telegram.org/bot${BOT_TOKEN}`;
            console.log('Конфиг загружен');
            setInterval(checkMessages, 3000);
        })
        .catch(err => {
            console.error('Ошибка загрузки конфига:', err);
            document.getElementById('log').innerHTML = '❌ Ошибка загрузки конфига';
        });
    
    fetch('schedule.json')
        .then(response => response.json())
        .then(data => {
            scheduleData = data;
            console.log('Расписание загружено');
        })
        .catch(err => console.error('Ошибка загрузки расписания:', err));
    
    // ==================== ПРОВЕРКА ОТВЕТОВ ОТ СЕРВЕРА ====================
    function checkMessages() {
        if (!API_URL) return;
        fetch(`${API_URL}/getUpdates`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ offset: lastUpdateId + 1, timeout: 2 })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.result.length > 0) {
                data.result.forEach(update => {
                    lastUpdateId = update.update_id;
                    if (update.channel_post && update.channel_post.chat.id === CHANNEL_ID) {
                        const text = update.channel_post.text;
                        document.getElementById("log").innerHTML = `📥 ${text}`;
                    }
                });
            }
        })
        .catch(err => console.error("Ошибка проверки сообщений:", err));
    }
    
    // ==================== ВХОД ====================
    function checkPassword() {
        const pin = document.getElementById("pinInput").value;
        if (pin === PASSWORD) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "flex";
            setGreeting();
            updateCurrentLesson();
            renderTab("main");
            // Обновляем текущий урок каждые 30 секунд
            setInterval(updateCurrentLesson, 30000);
        } else {
            document.getElementById("loginError").textContent = "Неверный пароль";
            document.getElementById("pinInput").value = "";
        }
    }
    
    document.getElementById("pinInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") checkPassword();
    });
    
    // ==================== ПРИВЕТСТВИЕ ====================
    function setGreeting() {
        const hour = new Date().getHours();
        let text;
        if (hour >= 6 && hour < 12) text = "Доброе утро, сэр!";
        else if (hour >= 12 && hour < 18) text = "Добрый день, сэр!";
        else if (hour >= 18 && hour < 23) text = "Добрый вечер, сэр!";
        else text = "Доброй ночи, сэр!";
        document.getElementById("greeting").textContent = text;
    }
    
    // ==================== ТЕКУЩИЙ УРОК ====================
    function getCurrentLesson() {
        if (!scheduleData) return null;
        
        const now = new Date();
        const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
        const day = days[now.getDay()];
        const currentTime = now.getHours() * 60 + now.getMinutes();
        
        const daySchedule = scheduleData[day];
        if (!daySchedule) return null;
        
        for (let [num, lesson] of Object.entries(daySchedule)) {
            const bell = scheduleData.bells[num];
            if (!bell) continue;
            
            const [startH, startM] = bell.start.split(":").map(Number);
            const [endH, endM] = bell.end.split(":").map(Number);
            const startTime = startH * 60 + startM;
            const endTime = endH * 60 + endM;
            
            if (currentTime >= startTime && currentTime <= endTime) {
                return {
                    num: num,
                    subject: lesson.subject,
                    room: lesson.room,
                    teacher: lesson.teacher,
                    end: bell.end
                };
            }
        }
        return null;
    }
    
    function getNextLesson() {
        if (!scheduleData) return null;
        
        const now = new Date();
        const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
        const day = days[now.getDay()];
        const currentTime = now.getHours() * 60 + now.getMinutes();
        
        const daySchedule = scheduleData[day];
        if (!daySchedule) return null;
        
        for (let [num, lesson] of Object.entries(daySchedule)) {
            const bell = scheduleData.bells[num];
            if (!bell) continue;
            
            const [startH, startM] = bell.start.split(":").map(Number);
            const startTime = startH * 60 + startM;
            
            if (currentTime < startTime) {
                return {
                    num: num,
                    subject: lesson.subject,
                    room: lesson.room,
                    teacher: lesson.teacher,
                    start: bell.start
                };
            }
        }
        return null;
    }
    
    function updateCurrentLesson() {
        const current = getCurrentLesson();
        const next = getNextLesson();
        const container = document.getElementById("currentLesson");
        
        if (current && current.subject !== "---") {
            container.style.display = "block";
            document.getElementById("lessonSubject").textContent = `📚 ${current.num}-й урок: ${current.subject}`;
            document.getElementById("lessonDetails").textContent = `Каб. ${current.room} | ${current.teacher} | До ${current.end}`;
        } else if (next && next.subject !== "---") {
            container.style.display = "block";
            document.getElementById("lessonSubject").textContent = `⏰ Далее: ${next.subject}`;
            document.getElementById("lessonDetails").textContent = `${next.num}-й урок | Каб. ${next.room} | В ${next.start}`;
        } else {
            container.style.display = "none";
        }
    }
    
    // ==================== ВКЛАДКИ ====================
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        renderTab(tab);
    }
    
    function showWip(feature) {
        document.getElementById("log").innerHTML = `🚧 ${feature} — в разработке`;
    }
    
    function renderTab(tab) {
        const container = document.getElementById("tabContent");
        let html = "";
        
        if (tab === "main") {
            html = `
                <div class="section-title">БЫСТРЫЕ ДЕЙСТВИЯ</div>
                <div class="buttons">
                    <button class="btn btn-ping" onclick="sendCommand('ping')">🟢 Пинг</button>
                    <button class="btn btn-status" onclick="sendCommand('status')">📊 Статус ПК</button>
                    <button class="btn btn-weather" onclick="sendCommand('weather')">🌤 Погода</button>
                    <button class="btn btn-news" onclick="sendCommand('news')">📰 Новости</button>
                </div>
                <div class="section-title" style="margin-top:15px;">ШКОЛА</div>
                <div class="buttons">
                    <button class="btn btn-schedule" onclick="showWip('Расписание')">📅 Расписание<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-tram" onclick="showWip('Трамваи')">🚋 Трамваи<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-cheatsheet" onclick="showWip('Шпаргалки')">📝 Шпаргалки<span class="wip-badge">WIP</span></button>
                </div>
            `;
        } else if (tab === "control") {
            html = `
                <div class="section-title">ЗАПУСК</div>
                <div class="buttons">
                    <button class="btn btn-ue5" onclick="sendCommand('launch_ue5')">🚀 Анрил</button>
                    <button class="btn btn-wip" onclick="sendCommand('discord')">💬 Дискорд</button>
                </div>
                <div class="section-title" style="margin-top:15px;">ПИТАНИЕ</div>
                <div class="buttons">
                    <button class="btn btn-shutdown" onclick="sendCommand('shutdown')">⏻ Выкл ПК</button>
                    <button class="btn btn-cancel" onclick="sendCommand('cancel_shutdown')">❌ Отмена</button>
                </div>
            `;
        } else if (tab === "school") {
            html = `
                <div class="section-title">📚 ШКОЛА И УЧЁБА</div>
                <div class="buttons">
                    <button class="btn btn-schedule" onclick="showWip('Расписание')">📅 Расписание<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-cheatsheet" onclick="showWip('Шпаргалки')">📝 Шпаргалки<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-calc" onclick="showWip('Калькулятор')">🧮 Калькулятор<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-tram" onclick="showWip('Трамваи')">🚋 Трамваи<span class="wip-badge">WIP</span></button>
                </div>
                <p class="music-hint">Скоро здесь будут:<br>расписание уроков, шпаргалки по предметам,<br>калькулятор и трамваи</p>
            `;
        } else if (tab === "music") {
            html = `
                <div class="section-title">УПРАВЛЕНИЕ МУЗЫКОЙ</div>
                <div class="buttons">
                    <button class="btn btn-music" onclick="sendCommand('music_play')">▶ Плей / Пауза</button>
                    <button class="btn btn-music-next" onclick="sendCommand('music_next')">⏭ Следующий</button>
                    <button class="btn btn-music-prev" onclick="sendCommand('music_prev')">⏮ Предыдущий</button>
                </div>
                <p class="music-hint">Работает с любым плеером<br>(ВК, YouTube Music, Spotify, AIMP)</p>
            `;
        } else if (tab === "tools") {
            html = `
                <div class="section-title">ИНСТРУМЕНТЫ</div>
                <div class="buttons">
                    <button class="btn btn-calc" onclick="showWip('Калькулятор')">🧮 Калькулятор<span class="wip-badge">WIP</span></button>
                    <button class="btn btn-weather" onclick="sendCommand('weather')">🌤 Погода</button>
                    <button class="btn btn-news" onclick="sendCommand('news')">📰 Новости</button>
                    <button class="btn btn-wip" onclick="showWip('Заметки')">📋 Заметки<span class="wip-badge">WIP</span></button>
                </div>
                <p class="music-hint">Скоро: калькулятор, заметки,<br>очистка ПК и многое другое</p>
            `;
        }
        
        container.innerHTML = html;
    }
    
    // ==================== ОТПРАВКА КОМАНД ====================
    function sendCommand(command) {
        if (!command || !command.trim()) return;
        if (!API_URL) {
            document.getElementById("log").innerHTML = "❌ Конфиг ещё не загружен";
            return;
        }
        
        fetch(`${API_URL}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHANNEL_ID, text: command })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                document.getElementById("log").innerHTML = `📤 ${command}`;
                document.getElementById("cmdInput").value = "";
            } else {
                document.getElementById("log").innerHTML = `❌ Ошибка: ${data.description}`;
            }
        })
        .catch(err => {
            document.getElementById("log").innerHTML = `❌ Нет связи: ${err.message}`;
        });
    }
    
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("cmdInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendCommand(this.value);
        });
    });
</script>

</body>
</html>
