<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Client</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <h1>JARVIS</h1>
    <input type="password" id="pinInput" placeholder="Пароль" maxlength="20">
    <br>
    <button onclick="checkPassword()">ВОЙТИ</button>
    <div id="loginError"></div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="mainScreen">
    <div class="header">
        <h1>JARVIS</h1>
        <span class="status" id="statusIndicator">🟢</span>
    </div>
    
    <div class="greeting" id="greeting">Доброе утро, сэр!</div>
    
    <div class="current-lesson" id="currentLesson">
        <div class="lesson-subject" id="lessonSubject"></div>
        <div class="lesson-details" id="lessonDetails"></div>
    </div>
    
    <div class="log" id="log">[Готов к работе]</div>
    
    <div class="tab-content" id="tabContent"></div>
    
    <div class="cmd-bar">
        <input type="text" id="cmdInput" placeholder="Своя команда...">
        <button onclick="sendCommand(document.getElementById('cmdInput').value)">▶</button>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('main')">🏠</button>
        <button class="nav-btn" onclick="switchTab('control')">🎮</button>
        <button class="nav-btn" onclick="switchTab('school')">📚</button>
        <button class="nav-btn" onclick="switchTab('music')">🎵</button>
        <button class="nav-btn" onclick="switchTab('tools')">⚙️</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РАСПИСАНИЯ -->
<div class="modal-overlay" id="scheduleModal">
    <div class="modal">
        <h2>📅 Расписание</h2>
        <div id="scheduleContent"></div>
        <button class="modal-close" onclick="closeSchedule()">Закрыть</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ПОДРОБНОСТЕЙ УРОКА -->
<div class="modal-overlay" id="lessonDetailModal">
    <div class="modal">
        <h2 id="lessonDetailTitle"></h2>
        <div id="lessonDetailContent"></div>
        <button class="modal-close" onclick="closeLessonDetail()">Закрыть</button>
    </div>
</div>
<!-- МОДАЛЬНОЕ ОКНО ШПАРГАЛОК -->
<div class="modal-overlay" id="cheatsheetModal">
    <div class="modal">
        <div id="cheatsheetContent"></div>
        <button class="modal-close" onclick="closeCheatsheet()">Закрыть</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО КАЛЬКУЛЯТОРА -->
<div class="modal-overlay" id="calcModal">
    <div class="modal calc-modal">
        <h2>🧮 Калькулятор</h2>
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-buttons">
            <button class="calc-btn calc-btn-func" onclick="calcInput('sin(')">sin</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('cos(')">cos</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('tan(')">tan</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('log(')">log</button>
            
            <button class="calc-btn calc-btn-func" onclick="calcInput('sqrt(')">√</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('^2')">x²</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('^')">xⁿ</button>
            <button class="calc-btn calc-btn-func" onclick="calcInput('pi')">π</button>
            
            <button class="calc-btn" onclick="calcInput('7')">7</button>
            <button class="calc-btn" onclick="calcInput('8')">8</button>
            <button class="calc-btn" onclick="calcInput('9')">9</button>
            <button class="calc-btn calc-btn-op" onclick="calcInput('/')">÷</button>
            
            <button class="calc-btn" onclick="calcInput('4')">4</button>
            <button class="calc-btn" onclick="calcInput('5')">5</button>
            <button class="calc-btn" onclick="calcInput('6')">6</button>
            <button class="calc-btn calc-btn-op" onclick="calcInput('*')">×</button>
            
            <button class="calc-btn" onclick="calcInput('1')">1</button>
            <button class="calc-btn" onclick="calcInput('2')">2</button>
            <button class="calc-btn" onclick="calcInput('3')">3</button>
            <button class="calc-btn calc-btn-op" onclick="calcInput('-')">−</button>
            
            <button class="calc-btn" onclick="calcInput('0')">0</button>
            <button class="calc-btn" onclick="calcInput('.')">.</button>
            <button class="calc-btn calc-btn-eq" onclick="calcCalculate()">=</button>
            <button class="calc-btn calc-btn-op" onclick="calcInput('+')">+</button>
            
            <button class="calc-btn calc-btn-clear" onclick="calcClear()">C</button>
            <button class="calc-btn calc-btn-clear" onclick="calcBackspace()">⌫</button>
            <button class="calc-btn" onclick="calcInput('(')">(</button>
            <button class="calc-btn" onclick="calcInput(')')">)</button>
        </div>
        <div class="calc-history" id="calcHistory"></div>
        <button class="modal-close" onclick="closeCalc()" style="margin-top:10px;">Закрыть</button>
    </div>
</div>
<!-- Скрипты -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/schedule.js"></script>
<script src="js/tabs.js"></script>
<script src="js/commands.js"></script>

</body>
</html>
